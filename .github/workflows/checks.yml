name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 검사
        run: node .github/check-syntax.js
      - name: 회귀 검사
        run: node .github/check-guards.js
      - name: 대량 삭제 검사
        env:
          BULK_BASE: ${{ github.event.before }}
        run: node .github/check-bulk.js
