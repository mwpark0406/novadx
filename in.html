<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--line2:#f1f3f5;--ink:#111827;--body:#475569;--muted:#6b7280;--brand:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--sh:0 1px 3px rgba(16,42,67,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--body);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.1px;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.hidden{display:none!important}
#boot-ov{position:fixed;inset:0;background:#f7f9fc;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:14px;z-index:200}
#app{display:none}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:236px;background:#f1f5f9;color:#475569;display:flex;flex-direction:column;z-index:20;border-right:1px solid #d8e0ea;box-shadow:3px 0 16px rgba(16,42,67,.06)}
.brand{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e4e8ef}
.brand .lg{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.brand b{color:#1c2534;font-size:14px}.brand small{display:block;color:#64748b;font-size:10.5px}
.nav{flex:1;padding:14px 12px;overflow:auto}
.nav .grp{font-size:10.5px;font-weight:700;color:#64748b;letter-spacing:.08em;padding:6px 12px 8px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:#334155;font-weight:500;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:#eef2f7;color:#1c2534}.nav a.active{background:#eaf1fd;color:#2563eb;font-weight:600}
.nav .ico{width:18px;text-align:center}
.acct{margin:8px 12px 4px;background:#fff;border:1px solid #e4e8ef;border-radius:11px;padding:10px 11px}
.acct .row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.acct .av{width:30px;height:30px;border-radius:50%;background:#ff4500;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;font-size:13px}
.acct .nm{font-size:12px;font-weight:700;color:#1c2534;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .em{font-size:10px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .btns{display:flex;gap:5px}
.acct .btns button{flex:1;background:#f1f5f9;border:1px solid #e4e8ef;border-radius:7px;padding:6px 0;color:#475569;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.acct .btns button:hover{background:#e8edf3;color:#1c2534}
.switch-wrap{padding:6px 12px 4px;position:relative}
.switch-btn{width:100%;background:#fff;border:1px solid #e4e8ef;border-radius:9px;padding:9px 11px;color:#475569;font-size:12px;display:flex;align-items:center;gap:7px}
.switch-btn:hover{background:#eef2f7}
.switch-dd{display:none;position:absolute;bottom:106%;left:12px;right:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 -12px 32px rgba(16,42,67,.16);z-index:30;padding:6px;max-height:60vh;overflow-y:auto}
.switch-dd.open{display:block}
.sw-item{margin-top:2px;border-radius:7px;padding:8px 11px;display:flex;align-items:center;gap:8px;color:#475569;font-size:12px;cursor:pointer}
.sw-item:hover{background:#f1f5f9}.sw-item.cur{color:#2563eb;font-weight:700;background:#eaf1fd}
.sw-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:18px;color:#fff;border-radius:5px;font-size:10px;font-weight:700;padding:0 5px}
#main{margin-left:236px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:15;background:rgba(246,247,249,.9);backdrop-filter:blur(8px);padding:18px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar h2{font-size:20px;font-weight:800;color:var(--ink)}
.topbar .desc{color:var(--muted);font-size:12.5px;margin-top:3px}
.wrap{padding:20px 28px 50px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.btn:hover{background:#f8fafc}.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{filter:brightness(.92)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;box-shadow:none}
.sel{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--sh);font-size:12.5px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .v{font-size:21px;font-weight:800;color:var(--ink);line-height:1.1}.kpi .l{font-size:11.5px;color:var(--muted);margin-top:6px}.kpi .s{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh)}
.sect{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.c-blue{background:#e0e7ff;color:#4338ca}.c-green{background:#dcfce7;color:#15803d}.c-amber{background:#fef3c7;color:#b45309}.c-red{background:#fee2e2;color:#b91c1c}.c-gray{background:#eef1f5;color:#475569}.c-cyan{background:#cffafe;color:#0e7490}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;background:#fafbfc}
td.l,th.l{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover td{background:#f8f9ff}
.bar{height:7px;background:#f1f5f9;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.muted{color:var(--muted)}.up{color:var(--ok)}.dn{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}

.hero{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #e5e9f2;border-radius:16px;color:#334155;padding:22px 24px;margin-bottom:16px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:22px}
.hero .hl{font-size:11.5px;color:#64748b;font-weight:600}
.hero .hv{font-size:30px;font-weight:800;color:#0f172a;line-height:1.1;margin-top:5px}
.hero .hs{font-size:12px;color:#64748b;margin-top:5px}
.hero .divv{border-left:1px solid #dbe1ee;padding-left:22px}
.gauge{height:9px;background:rgba(37,99,235,.15);border-radius:8px;overflow:hidden;margin-top:9px}
.gauge>i{display:block;height:100%;border-radius:8px}
/* 차트 */
.combo{display:flex;gap:5px;align-items:flex-end}
.combo .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.combo .bars{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:130px;position:relative}
.combo .b1{width:38%;background:var(--brand);border-radius:4px 4px 0 0;min-width:8px}
.combo .b2{width:38%;background:#94c2a8;border-radius:4px 4px 0 0;min-width:8px}
.combo .tgt{position:absolute;left:6%;right:6%;border-top:2px dashed #cbd5e1}
.combo .ml{font-size:10px;color:var(--muted)}
.combo .mv{font-size:10.5px;font-weight:700;color:var(--ink)}
/* 드로어 */
#dwbg{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;z-index:45}
#dw{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:97vw;background:#fbfcfd;box-shadow:-16px 0 50px rgba(16,24,40,.22);transform:translateX(100%);transition:transform .25s;z-index:46;display:flex;flex-direction:column}
#dw.open{transform:none}
.dwh{padding:18px 22px;border-bottom:1px solid var(--line);background:#fff}
.dwh .k{font-size:11px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.dwh h3{font-size:18px;color:var(--ink);margin-top:4px}
.dwh .x{border:0;background:transparent;font-size:24px;color:var(--muted);cursor:pointer;float:right}
.dwb{padding:16px 22px;overflow:auto;flex:1}
.dwcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:13px;box-shadow:var(--sh)}
/* 모달 */
#mbg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:16px;width:540px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:15.5px}.mh .x{border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer}
.mb{padding:18px 20px}.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--body);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fafbfc}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:90;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
#pdf-fab{position:fixed;bottom:18px;right:18px;z-index:40;background:#475569;color:#fff;border:0;border-radius:22px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(15,23,42,.28)}
@media print{#sidebar,#pdf-fab,.topbar .desc,#dwbg,#dw{display:none!important}#main{margin-left:0}body{background:#fff}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}

</style>

<style>
/* == WT-DESIGN-POLISH-v1 : 공통 디자인 정제(안전 패스) == */
.card,.kpi-card,.stat-card{border-radius:16px!important;box-shadow:none!important;border:1px solid var(--line,#e6e9ef)!important} /*WT-DEEP-v2*/
.modal-content{border-radius:18px}

<style id="wt-align-v1">
/* ══════════ WT-ALIGN-V1 · 정렬(오와 열) · 간격 · 위계 통일 레이어 ══════════
   표현(CSS)만 다루는 마지막 캐스케이드 계층. 기능/데이터/마크업 로직 무관.
   라이트 테마 유지 — 배경(--bg)·카드 흰색·브랜드 색 재정의 없음.            */

/* ── 0. 형태 토큰: 라운드·그림자를 컴포넌트 전체에서 단일화 ───────────── */
:root{
  --r-card:14px; --r-ctl:10px;
  --sh-card:0 1px 2px rgba(16,42,67,.06);
  --sh-pop:0 18px 48px rgba(16,42,67,.20);
  --gap-sec:16px;
}
.card,.kpi,.dwcard,.acard,.ccard,.statcard,.mcard,.lbcard,.kbcol{
  border-radius:var(--r-card)!important;
  box-shadow:var(--sh-card)!important}
.card:not([style*="border:0"]),.kpi,.dwcard{border:1px solid var(--line)!important}
.kcard{border-radius:10px}
.modal{border-radius:16px;box-shadow:var(--sh-pop)}
.hero{border-radius:var(--r-card)}
.btn{border-radius:var(--r-ctl)}
.btn-sm{border-radius:9px}
.sel{border-radius:var(--r-ctl)}

.grid,.kpis,.mcards,.cgrid{align-items:stretch}
.grid>*,.kpis>*,.mcards>*,.cgrid>*{min-width:0}
.kpi,.mcard,.statcard{display:flex;flex-direction:column;height:100%}

function monthsOf(arr,f){const s=new Set(arr.map(x=>ym(x[f||'date'])).filter(Boolean));return[...s].sort().reverse();}

function colSum(s){return (s.collections||[]).reduce((a,c)=>a+(+c.amt||0),0);}
function outAmt(s){return Math.max(0,(+s.amt||0)-colSum(s));}
function salesMonthly(yr){const m={};(D.sales||[]).forEach(s=>{const d=String(s.date||'');if(d.slice(0,4)!==yr)return;const k=+d.slice(5,7);m[k]=(m[k]||0)+(+s.amt||0);});return m;}
function payMonthly(yr){const m={};(D.sales||[]).forEach(s=>(s.collections||[]).forEach(c=>{const d=String(c.date||'');if(d.slice(0,4)!==yr)return;const k=+d.slice(5,7);m[k]=(m[k]||0)+(+c.amt||0);}));return m;}
function tgtMonthly(yr){const m={};Object.keys(D.targets||{}).forEach(k=>{if(k.slice(0,4)===yr)m[+k.slice(5,7)]=+D.targets[k]||0;});return m;}
function ytd(m,uptoM){let s=0;for(let i=1;i<=uptoM;i++)s+=m[i]||0;return s;}
function totalOut(){return (D.sales||[]).reduce((a,s)=>a+outAmt(s),0);}
function agingBucket(s){const o=outAmt(s);if(o<=0)return null;const d=daysBetween(s.date||today(),today());return d>=90?'90+':d>=60?'60+':d>=30?'30+':'30내';}
function fundsBalAcc(name){const acc=(D.accounts||[]).find(a=>a.name===name);let b=acc?(+acc.opening||0):0;(D.funds||[]).forEach(f=>{if((f.account||'주거래계좌')!==name)return;b+=(f.kind==='입금'?1:-1)*(+f.amt||0);});return b;}
function fundsBal(){return (D.accounts||[]).reduce((a,x)=>a+fundsBalAcc(x.name),0);}
function itemQty(name){const it=(D.items||[]).find(i=>i.name===name);let q=it?(+it.qty0||0):0;(D.moves||[]).forEach(m=>{if(m.item===name)q+=(m.type==='입고'?1:-1)*(+m.qty||0);});return q;}

function vDash(){
  const yr=curYr(), mo=+curYm().slice(5,7);

  const opInc=ySale-yExp, opMgn=ySale>0?opInc/ySale*100:null;
  const expByCat=(function(){const m={};(D.expenses||[]).forEach(e=>{if(String(e.ym||'').slice(0,4)!==String(yr))return;m[e.category||'기타']=(m[e.category||'기타']||0)+(+e.amt||0);});
    return Object.keys(m).map(k=>({k:k,v:m[k]})).sort((a,b)=>b.v-a.v);})();

// ── 매출 · 수금 ──
let fSalesYm='',fOutOnly=false,fSalesQ='';
function vSales(){
  const yms=monthsOf(D.sales||[]);
  let L=(D.sales||[]).slice();
  if(fSalesYm)L=L.filter(s=>ym(s.date)===fSalesYm);
  if(fOutOnly)L=L.filter(s=>outAmt(s)>0);
  if(fSalesQ){const q=fSalesQ.toLowerCase();L=L.filter(s=>((s.client||'')+' '+(s.product||'')).toLowerCase().indexOf(q)>=0);}
  L.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const tot=L.reduce((a,s)=>a+(+s.amt||0),0), col=L.reduce((a,s)=>a+colSum(s),0), out=L.reduce((a,s)=>a+outAmt(s),0);
  const rows=L.length?L.map(s=>{const o=outAmt(s);const b=agingBucket(s);
    return `<tr onclick="dwSale('${s.id}')"><td class="l">${s.date}</td><td class="l"><b style="color:var(--ink)">${esc(s.client)}</b></td><td class="l">${esc(s.product)||'-'}</td><td>${s.qty||'-'}</td>
    <td><b>${fm(s.amt)}</b></td><td style="color:var(--ok)">${colSum(s)?fm(colSum(s)):'-'}</td>
    <td>${o>0?`<b style="color:var(--bad)">${fm(o)}</b>${b&&b!=='30내'?` <span class="chip c-${b==='90+'?'red':'amber'}">${b}</span>`:''}`:'<span class="chip c-green">완납</span>'}</td>

  return head('🧾 매출 · 수금','매출인식 기준 · 행 클릭 → 상세(수금내역) · ＋수금 = 잔액 전액 오늘 처리',
    `<input class="sel" placeholder="거래처·제품 검색" value="${esc(fSalesQ)}" oninput="fSalesQ=this.value;_thSearch()" onkeydown="if(event.key==='Enter')render()" style="min-width:150px">`+
    `<select class="sel" onchange="fSalesYm=this.value;render()"><option value="">전체 기간</option>${yms.map(m=>`<option ${fSalesYm===m?'selected':''}>${m}</option>`).join('')}</select>`+
    `<button class="btn btn-sm ${fOutOnly?'btn-primary':''}" onclick="fOutOnly=!fOutOnly;render()">미수만</button>`+
    ``+
    `<button class="btn btn-primary" onclick="mSale()">+ 매출 등록</button>`)
    +`<div class="grid kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <div class="kpi"><div class="v">${fm(tot)}</div><div class="l">${fSalesYm||'전체'} 매출</div><div class="s">${fkrw(tot)}</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${fm(col)}</div><div class="l">수금</div></div>
      <div class="kpi"><div class="v" style="color:${out?'var(--bad)':'var(--ink)'}">${fm(out)}</div><div class="l">미수</div><div class="s">${fkrw(out)}</div></div>
      <div class="kpi"><div class="v">${L.length}</div><div class="l">건수</div></div></div>
    <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th class="l">인식일</th><th class="l">거래처</th><th class="l">제품</th><th>수량</th><th>매출(${CUR})</th><th>수금</th><th>미수</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function mSale(id,pre){const s=id?(D.sales||[]).find(x=>x.id===id):Object.assign({date:today(),client:'',product:'',qty:'',amt:'',memo:''},pre||{});

async function quickCollect(id){if(_thBusy)return;const s=(D.sales||[]).find(x=>x.id===id);if(!s)return;const o=outAmt(s);if(o<=0)return;

async function addCol(id){const s=(D.sales||[]).find(x=>x.id===id);if(!s)return;

let fAg='',fArQ='';

  const chips=Object.keys(ag).map(k=>`<button class="btn btn-sm ${fAg===k?'btn-primary':''}" onclick="fAg=fAg==='${k}'?'':'${k}';render()">${k} ${fmS(ag[k])}</button>`).join('');

function handleXlsxItems(e){
  const file=e.target.files[0];const prev=document.getElementById('xlsx-preview');
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const norm=k=>String(k||'').replace(/\s/g,'');
      const pick=(row,names)=>{for(const k of Object.keys(row)){if(names.indexOf(norm(k))>=0)return row[k];}return '';};
      const items=rows.map(row=>({
        name:String(pick(row,['장비명','장비','품목명','품목','name'])).trim(),
        qty0:Number(pick(row,['기초수량','기초재고','수량','qty0']))||0,
        unit:String(pick(row,['단위','unit'])||'개').trim()||'개',
        safety:Number(pick(row,['안전재고','안전','safety']))||0,
        loc:String(pick(row,['위치','보관위치','loc'])||'').trim(),
      })).filter(r=>r.name);
      _impItems=items.length?items:null;
      if(prev)prev.textContent=items.length?(items.length+'건 인식됨: '+items.slice(0,5).map(x=>x.name).join(', ')+(items.length>5?' 외':'')):'인식된 장비가 없습니다 — 첫 줄(제목) 확인';
    }catch(err){
      _impItems=null;
      if(prev)prev.textContent='파일을 읽을 수 없습니다: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

    async()=>{

function handleXlsxAsset(e){
  const file=e.target.files[0];const prev=document.getElementById('xlsx-asset-preview');
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!grid.length){_impAsset=null;if(prev)prev.textContent='빈 파일입니다';return;}
      const norm=k=>String(k||'').replace(/\s/g,'');
      const header=grid[0].map(norm);
      const findCol=names=>header.findIndex(h=>names.some(n=>h.indexOf(n)>=0));
      let iItem=findCol(['품목명','품목','name','item']);
      let iSerial=findCol(['시리얼번호','시리얼','serial']);
      let iClient=findCol(['고객사','거래처','납품처','customer','client']);
      let iNote=findCol(['메모','비고','note','memo']);
      if(iItem<0||iSerial<0){ // 헤더 인식 실패 → 기존 대장 형식(품목명·수량·지사·시리얼·입고일·출고일·메모) 위치로 가정, 날짜 컬럼은 무시
        iItem=0;iSerial=3;iClient=-1;iNote=6;
      }
      const NON_CLIENT=['보관','창고','사무실'];
      const OUT_HINT=['전시','데모'];
      const rows=grid.slice(1);
      const items=rows.map(r=>{
        const serial=String(r[iSerial]??'').trim();
        if(!serial)return null;
        const item=String(r[iItem]??'').trim();
        let client=iClient>=0?String(r[iClient]??'').trim():'';
        let note=iNote>=0?String(r[iNote]??'').trim():'';
        if(!client&&note){const isGeneric=NON_CLIENT.concat(OUT_HINT).some(k=>note.indexOf(k)>=0);if(!isGeneric){client=note;note='';}}
        const status=client?'설치':(note&&NON_CLIENT.some(k=>note.indexOf(k)>=0)?'재고':(note?'출고':'재고'));
        return {serial,item,client,note,status};
      }).filter(Boolean);
      _impAsset=items.length?items:null;
      if(prev)prev.textContent=items.length?(items.length+'건 인식됨 (재고 '+items.filter(x=>x.status==='재고').length+' · 출고/설치 '+items.filter(x=>x.status!=='재고').length+')'):'인식된 장비가 없습니다 — 시리얼 컬럼 확인';
    }catch(err){
      _impAsset=null;
      if(prev)prev.textContent='파일을 읽을 수 없습니다: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}
