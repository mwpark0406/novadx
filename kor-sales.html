<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>노바진단 · 국내영업 매출현황</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230891b2'/><g transform='translate(13,36) scale(0.144)' fill='%23fff'><rect width='110' height='110' rx='28'/><rect x='204' width='110' height='110' rx='28'/><rect x='408' width='110' height='110' rx='28'/><rect x='102' y='97' width='110' height='110' rx='28'/><rect x='306' y='97' width='110' height='110' rx='28'/></g></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--blue:#2563eb;--navy:#16324f;--ink:#182230;--text:#1f2937;--text-2:#64748b;--mut:#94a3b8;--border:#e4e8ef;--line:#eef1f5;--bg:#f5f7fb;--white:#fff;--green:#15803d;--red:#dc2626;--amber:#d97706;--yellow:#eab308;--lemon:#fef9c3;--lemon-2:#fde68a;--gold-text:#854d0e;--hover:var(--lemon);--active:var(--lemon-2)}
*{box-sizing:border-box}
html{color-scheme:only light}
body{min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',sans-serif;margin:0;color:var(--text);font-size:14px}
.tabular{font-variant-numeric:tabular-nums}
/* ── 상단 네비바 ── */
.wt-top{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:4px;background:#fff;border-bottom:1px solid var(--border);border-top:3px solid var(--yellow);padding:0 22px;height:54px;box-shadow:0 1px 8px rgba(16,42,67,.05)}
.wt-top .brand{display:flex;align-items:center;gap:9px;padding-right:15px;margin-right:5px;border-right:1px solid var(--line);flex-shrink:0}
.wt-top .brand .ico{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.wt-top .brand b{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.2px;line-height:1.1}
.wt-top .brand span{font-size:9.5px;color:var(--mut);display:block;font-weight:500}
.wt-top nav{display:flex;align-items:center;gap:1px;flex:1;overflow-x:auto;scrollbar-width:none}
.wt-top nav::-webkit-scrollbar{display:none}
.tnav{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;border:none;background:none;transition:all .13s}
.tnav i{font-size:15px}
.tnav:hover{background:var(--hover);color:var(--ink)}
.tnav.on{background:var(--active);color:var(--gold-text)}
.tnav .bdg{background:#eef2f7;color:#475569;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:19px;text-align:center;font-variant-numeric:tabular-nums}
.tnav.on .bdg{background:#fde68a;color:var(--gold-text)}
.tnav .bdg.rd{background:#fdeaea;color:var(--red)}
.wt-top .util{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.uic{position:relative;display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#475569;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.uic:hover{background:var(--hover);color:var(--gold-text)}
.uic i{font-size:15px}
.uic .dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:112%;right:0;min-width:190px;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:0 10px 30px rgba(16,42,67,.16);z-index:400}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;gap:9px;padding:9px 13px;font-size:12.5px;color:#475569;cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--hover)}
.dd-item .bdg{min-width:26px;height:19px;border-radius:5px;color:#fff;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.dd-head{padding:9px 13px 6px;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
/* ── 메인 ── */
.main{max-width:none;margin:0;padding:16px 22px 26px}
.wt-band-sm{padding:11px 20px!important;margin-bottom:14px}
.wt-band-sm .wt-hero>b{font-size:29px}
.wt-band-sm .wt-fact b{font-size:20px}
.wt-band-sm .s:empty{display:none}
.wt-mast{padding-bottom:13px;border-bottom:2px solid var(--navy);margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.wt-mast .kick{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.wt-mast .t{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:4px;display:flex;align-items:center;gap:9px}
.wt-mast .t i{color:var(--blue);font-size:20px}
.wt-mast .asof{font-size:12px;color:var(--text-2);text-align:right}
#chgbar{margin-bottom:16px}
.chg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eff5ff;border:1px solid #cfe0fb;border-radius:10px;padding:9px 14px;font-size:12.5px;color:#42506a}
.chg>i{color:var(--blue);font-size:14px}
.chg .lb{font-weight:700;color:var(--ink)}
.chg b{font-weight:700;background:#fff;border:1px solid #d8e3f5;border-radius:20px;padding:2px 11px;color:var(--blue);font-variant-numeric:tabular-nums}
.chg b.g{color:var(--green);border-color:#bbf7d0}.chg b.r{color:var(--red);border-color:#fecaca}
.chg .mo{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}
.chg .cx{margin-left:auto;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer}
/* 필터 툴바 */
.wt-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:18px}
.wt-tools .fl{font-size:11px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:5px}
.wt-tab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#475569;background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:6px 13px;cursor:pointer;transition:all .15s;line-height:1;white-space:nowrap}
.wt-tab:hover{background:var(--lemon);border-color:var(--lemon-2);color:var(--gold-text)}
.wt-tab.on{background:var(--yellow);border-color:var(--yellow);color:#3f2d00}
.wt-tools .form-select,.wt-tools .form-control{font-size:12.5px;border-color:#dbe3ec;color:var(--text);border-radius:8px;padding:6px 11px;width:auto}
.wt-tools .form-select{padding-right:30px;min-width:112px}
.wt-asof{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.wt-tools .form-control:focus,.wt-tools .form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.wt-sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.wt-cnt{margin-left:12px;font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.wt-cnt b{color:var(--ink)}
/* 히어로+팩트 밴드 */
.wt-band{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 24px;margin-bottom:18px;flex-wrap:wrap;gap:6px 0}
.wt-hero{flex:1.2;padding-right:22px;display:flex;flex-direction:column;justify-content:center;min-width:180px}
.wt-hero .l{font-size:11.5px;font-weight:700;color:var(--text-2)}
.wt-hero>b{font-size:36px;font-weight:800;color:var(--blue);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.08}
.wt-hero>b.rd{color:var(--red)}
.wt-hero>b .u{font-size:18px;font-weight:700;margin-left:2px}
.wt-hero .s{font-size:12px;color:var(--text-2);margin-top:3px}
.wt-fact{flex:1;padding:2px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;min-width:120px}
.wt-fact.clk{cursor:pointer}.wt-fact.clk:hover .l{color:var(--blue)}
.wt-fact .l{font-size:11px;font-weight:700;color:var(--text-2);white-space:nowrap}
.wt-fact b{font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.wt-fact b .u{font-size:12px;font-weight:700;margin-left:1px}
.wt-fact .s{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-fact b.rd{color:var(--red)}.wt-fact b.gr{color:var(--green)}.wt-fact b.am{color:var(--amber)}
/* 카드/섹션 */
.wt-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-width:0}
.wt-st{font-size:14px;font-weight:800;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:13px;display:flex;align-items:center;gap:8px}
.wt-st i{color:var(--blue);font-size:15px}
.wt-st .hint{margin-left:auto;font-size:11px;font-weight:500;color:var(--mut)}
.wt-st .mo{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--blue);cursor:pointer;text-decoration:none}
.wt-grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}.g-32{grid-template-columns:1.6fr 1fr}
/* 표 */
.wt-tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.wt-tbl thead th{background:#fafbfc;color:#475569;font-size:11.5px;font-weight:700;border-top:2px solid var(--navy);border-bottom:1px solid var(--border);padding:8px 10px;text-align:right;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
.wt-tbl thead th.l{text-align:left}.wt-tbl thead th:hover{color:var(--gold-text);background:var(--lemon)}
.wt-tbl tbody td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;white-space:nowrap;color:var(--text)}
.wt-tbl tbody td.l{text-align:left}
.wt-tbl tbody tr{cursor:pointer}
.wt-tbl tbody tr:hover{background:#fefce8}
.wt-tbl .rk{color:var(--mut);font-weight:700;text-align:center;width:26px}
.wt-tbl .nm{font-weight:600;color:var(--ink)}
.wt-tbl b{color:var(--ink);font-weight:700}
.wt-tbl th:not(.l),.wt-tbl td:not(.l){width:1px}
/* 정산 인라인 표: 입력 컬럼 고정폭 정렬 + 촘촘 */
.il-tbl tbody td{padding:4px 8px}
.il-tbl td:nth-child(6),.il-tbl th:nth-child(6){width:280px}
.il-tbl td:nth-child(7),.il-tbl th:nth-child(7){width:190px}
.il-tbl td:nth-child(8),.il-tbl th:nth-child(8){width:165px}
/* 계약 현황 표: 거래처-사업자번호 여백 축소, 비고 확장 */
.il-tbl2 td:nth-child(2),.il-tbl2 th:nth-child(2){width:150px;padding-right:6px}
.il-tbl2 td:nth-child(3),.il-tbl2 th:nth-child(3){padding-left:6px}
.il-row{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.il-lb{font-size:10.5px;font-weight:700;color:var(--mut);width:44px;text-align:right}
.il-in{padding:2px 6px;font-size:11.5px;display:inline-block}
.il-ok{padding:1px 9px;font-size:11px}
.mut{color:var(--mut)}.tx2{color:var(--text-2)}
.scroll{overflow:auto;max-height:64vh}
.badge-st{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.btn-pay{background:#fef3c7;border:1px solid #fcd34d;color:#b45309;font-weight:700}
.btn-pay:hover{background:#fde68a;border-color:#fbbf24;color:#92400e}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:34px}
.warnnote{font-size:12px;color:#8a6d3b;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 13px}
/* 메시지 */
.msg{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line)}
.msg .av{width:30px;height:30px;border-radius:50%;background:var(--active);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.msg .bd{flex:1;min-width:0}
.msg .hd{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:3px}
.msg .hd .au{font-weight:700;color:var(--ink)}
.msg .hd .tm{color:var(--mut);font-size:11px}
.msg .hd .del{margin-left:auto;background:none;border:none;color:var(--mut);font-size:11px;cursor:pointer}
.msg .hd .del:hover{color:var(--red)}
.msg .tx{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.composer textarea{flex:1;border:1px solid #dbe3ec;border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;resize:vertical;min-height:42px}
.composer textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.composer .btn{white-space:nowrap}
.msg-cols{column-count:2;column-gap:16px;margin-top:14px}
.msg-cols .msg{border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin:0 0 14px;break-inside:avoid}
@media(max-width:900px){.msg-cols{column-count:1}}
/* 빠른 검색 */
.gsearch{position:relative;display:flex;align-items:center;gap:7px;background:#f1f5f9;border:1px solid #e4e8ef;border-radius:9px;padding:6px 10px;width:230px;margin:0 6px;flex-shrink:0}
.gsearch>i{color:var(--mut);font-size:14px}
.gsearch input{border:none;background:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--ink);flex:1;min-width:0}
.gsearch kbd{font-size:10px;color:var(--mut);background:#fff;border:1px solid #dbe3ec;border-radius:5px;padding:1px 6px;font-family:inherit}
.gs-dd{display:none;position:absolute;top:120%;right:0;background:#fff;border:1px solid var(--border);border-radius:11px;box-shadow:0 12px 32px rgba(16,42,67,.16);z-index:400;overflow:hidden;max-height:62vh;overflow-y:auto;width:360px}
.gs-dd.open{display:block}
.gs-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.gs-item:last-child{border-bottom:none}
.gs-item.sel,.gs-item:hover{background:var(--active)}
.gs-item .t{font-size:13px;font-weight:600;color:var(--ink)}
.gs-item .m{font-size:11px;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gs-empty{padding:16px;text-align:center;color:var(--mut);font-size:12.5px}
mark{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
/* 필터 칩 */
#fchips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-4px 0 16px}
#fchips:empty{display:none}
#fchips .fc-lb{font-size:11px;font-weight:700;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#eef4fd;border:1px solid #d3e2fb;color:#2455c4;font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 6px 3px 11px}
.chip i{cursor:pointer;font-size:13px;color:#7794c9}
.chip i:hover{color:var(--red)}
.chip-clr{background:none;border:none;color:var(--text-2);font-size:11.5px;text-decoration:underline;cursor:pointer}
/* 복사 가능 값 */
.drow .v.cp{cursor:pointer}
.drow .v.cp i{opacity:0;margin-left:5px;color:var(--mut);font-size:11px;transition:opacity .12s}
.drow:hover .v.cp i{opacity:1}
.drow .v.cp:hover{color:var(--blue)}
.mhd .x[disabled]{opacity:.3;cursor:default}
.dact{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.dact .btn i{font-size:13px}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.cform .cf{display:flex;flex-direction:column;gap:4px;min-width:0}
.cform .cf.wide{grid-column:1/-1}
.cform .cf label{font-size:11px;font-weight:700;color:var(--text-2)}
.cform-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:640px){.cform{grid-template-columns:1fr}}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:820px){.paygrid{grid-template-columns:1fr}}
.paycard{border:1px solid var(--border);border-radius:11px;padding:10px 13px;cursor:pointer;transition:border-color .12s,background .12s}
.paycard:hover{border-color:#a9c4e8;background:#f8fafc}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-cust{font-weight:700;color:var(--ink);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-btn{padding:2px 13px;font-size:11px;flex-shrink:0}
.pc-meta{font-size:12px;color:var(--text);margin-top:5px}
.pc-sub{font-size:11.5px;color:var(--text-2);margin-top:3px}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(16,42,67,.42);display:none;align-items:center;justify-content:center;z-index:8000;padding:16px}
.modal-bg.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:860px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 12px 34px rgba(15,23,42,.16);border:1px solid var(--border)}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.dcols .dsec:first-child{margin-top:2px}
@media(max-width:720px){.dcols{grid-template-columns:1fr}.mbox{max-width:640px}}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 22px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mhd h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin:0}
.mhd .x{background:none;border:none;font-size:19px;color:var(--mut);line-height:1;cursor:pointer}
.mbody{padding:16px 22px 22px}
.dsec{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.04em;margin:13px 0 4px;text-transform:uppercase}
.dsec:first-child{margin-top:0}
.drow{display:flex;justify-content:space-between;gap:14px;padding:5.5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.drow .k{color:var(--text-2);flex-shrink:0}
.drow .v{font-weight:600;color:var(--ink);text-align:right}
.tl{display:flex;margin:12px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px}
.tl .st .dot{width:11px;height:11px;border-radius:50%;background:#cbd5e1;margin:0 auto 5px;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.tl .st.done .dot{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tl .st b{display:block;color:var(--ink);font-weight:600;margin-bottom:1px}
.tl .st .dt{color:var(--mut);font-size:10px}
.tl .st:not(:last-child):after{content:'';position:absolute;top:5px;left:50%;width:100%;height:2px;background:#e2e8f0;z-index:0}
.tl .st.done:not(:last-child):after{background:var(--blue)}
/* 로딩/로그인 */
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9000;color:var(--mut);font-size:13px}
.spin{width:22px;height:22px;border:3px solid #dbe3ee;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2540,#1e3a5f);z-index:9001;padding:20px}

function ago(iso){ try{ const d=new Date(iso), n=new Date(), s=(n-d)/1000; if(s<60)return '방금'; if(s<3600)return Math.floor(s/60)+'분 전'; if(s<86400)return Math.floor(s/3600)+'시간 전';
  const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'),hh=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0'); return mm+'-'+dd+' '+hh+':'+mi; }catch(e){return '';} }

function gsKey(e){ const dd=document.getElementById('gs-dd');
  if(e.key==='ArrowDown'){ e.preventDefault(); if(_gsRes.length){_gsIdx=(_gsIdx+1)%_gsRes.length;gsHover(_gsIdx);} }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(_gsRes.length){_gsIdx=(_gsIdx-1+_gsRes.length)%_gsRes.length;gsHover(_gsIdx);} }
  else if(e.key==='Enter'){ if(_gsRes[_gsIdx])gsPick(_gsRes[_gsIdx].no); }

/* ── 자동 로그아웃: 30분 무동작 시 (마스터·데모 계정 제외) ── */
(function(){
  var IDLE_MS=30*60*1000, _it;
  function _logout(){
    if(typeof doLogout==='function'){ doLogout(); return; }
    try{ _sb.auth.signOut().then(function(){ location.reload(); }); }catch(e){ location.reload(); }
  }
  function _fire(){
    try{
      if(typeof _sb!=='undefined' && _sb && _sb.auth && _sb.auth.getSession){
        _sb.auth.getSession().then(function(r){
          var s=r&&r.data&&r.data.session;
          var _noAutoLogout=['master@demo.local','admin@demo.local','manager@demo.local','user@demo.local'];
          if(s&&s.user&&(_noAutoLogout.indexOf(s.user.email)>=0||/@demo\.local$/i.test(s.user.email||""))){ _arm(); return; }
          if(s) _logout(); else _arm();
        }).catch(function(){ _arm(); });
      } else { _arm(); }
    }catch(e){ _arm(); }
  }
  function _arm(){ clearTimeout(_it); _it=setTimeout(_fire, IDLE_MS); }
  ['mousemove','mousedown','keydown','touchstart','scroll','click','wheel'].forEach(function(ev){
    document.addEventListener(ev, _arm, {passive:true, capture:true});
  });
  _arm();
})();

function queues(){ const T=today0();
  const undel=ROWS.filter(r=>!has(r.dDelivered));
  return {
    late: undel.filter(r=>{const d=pd(r.dDeliverDue);return d&&d<T;}).sort((a,b)=>pd(a.dDeliverDue)-pd(b.dDeliverDue)),
    due:  undel.filter(r=>{const d=pd(r.dDeliverDue);return !d||d>=T;}).sort((a,b)=>{const x=pd(a.dDeliverDue),y=pd(b.dDeliverDue);if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;return x-y;}),
    coup: ROWS.filter(r=>isCoupon(r.product)&&has(r.dDelivered)&&!has(r.couponDate)),
    comm: ROWS.filter(r=>(r.channel==='대리점'||r.channel==='딜러')&&!commPaid(r)),
    tax:  ROWS.filter(r=>!has(r.dTax)),
    settle: ROWS.filter(r=>has(r.dDelivered)).map(r=>{const rem=[];
      if(!has(r.dTax))rem.push('계산서');
      if(isCoupon(r.product)&&!has(r.couponDate))rem.push('쿠폰');
      if((r.channel==='대리점'||r.channel==='딜러')&&!commPaid(r))rem.push('수수료');
      return rem.length?Object.assign({_rem:rem},r):null; }).filter(Boolean)
      .sort((a,b)=>(b._rem.length-a._rem.length)||((pd(a.dDelivered)||0)-(pd(b.dDelivered)||0)))
  };
}

/* ── 입력·편집·삭제 (kor_contracts) ── */
const CFIELDS=[
 ['거래처','cust','text'],['대표자','ceo','text'],['사업자번호','biznum','text'],['이메일','email','text'],
 ['검사분야·종목','biz','text'],['지역','region','list:regions'],['주소','addr','text2'],
 ['제품','product','list:products'],['계약금액(VAT포함)','amount','num'],['매출(원화환산)','krw','num'],['수량','qty','num'],
 ['담당자','rep','list:reps'],['채널','channel','sel:대리점,본사,딜러'],['상태','status','sel:완료,미납,납품,미분류'],['매출월(숫자)','saleMonth','num'],
 ['출고요청서 번호','shipReqNo','text'],
 ['수금방법','pay','list:pays'],['수금일','payDate','date'],
 ['수수료여부','commYN','sel:Y'],['수수료금액','commAmount','num'],['기안번호(수수료)','commission','text'],['비고','note','text2'],
 ['적립/쿠폰 지급일','couponDate','date'],['적립/쿠폰 수량','couponQty','text'],
 ['계약접수','dContract','date'],['출고예정(물류)','dShipDue','date'],['납품예정','dDeliverDue','date'],['납품완료','dDelivered','date'],['세금계산서','dTax','date']
];
function _dlist(dl){ const k={products:'product',reps:'rep',pays:'pay',regions:'region'}[dl]; return '<datalist id="dl-'+dl+'">'+[...new Set(ROWS.map(r=>r[k]).filter(Boolean))].sort().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'; }
function _fld(f,c){ const label=f[0],key=f[1],type=f[2],v=(c&&c[key]!=null)?c[key]:''; let input;
  if(type.slice(0,4)==='sel:'){ input='<select id="cf-'+key+'" class="form-select form-select-sm"><option value="">-</option>'+type.slice(4).split(',').map(o=>'<option'+(v===o?' selected':'')+'>'+o+'</option>').join('')+'</select>'; }
  else if(type.slice(0,5)==='list:'){ input='<input id="cf-'+key+'" class="form-control form-control-sm" autocomplete="off" list="dl-'+type.slice(5)+'" value="'+esc(v)+'">'; }
  else if(type==='num'){ input='<input id="cf-'+key+'" type="number" class="form-control form-control-sm" value="'+esc(v)+'">'; }
  else if(type==='date'){ input='<input id="cf-'+key+'" type="date" class="form-control form-control-sm" value="'+esc(String(v).slice(0,10))+'">'; }
  else { input='<input id="cf-'+key+'" class="form-control form-control-sm" value="'+esc(v)+'">'; }
  return '<div class="cf'+(type==='text2'||key==='cust'?' wide':'')+'"><label>'+label+'</label>'+input+'</div>';
}
function newContract(){ openForm(null); }
function editContract(no){ openForm(ROWS.find(r=>r.no===no)||null); }
function openForm(c){ window.__editC=c; window.__dno=null;

let _ksSaving=false;   /* 저장 버튼 중복 클릭 → 계약 중복 생성 방지 */
async function saveContract(){ if(_ksSaving)return; const c=window.__editC; const d=c?Object.assign({},c):{}; delete d._id; delete d._month;
  CFIELDS.forEach(f=>{ const el=document.getElementById('cf-'+f[1]); if(!el)return; let v=el.value; if(f[2]==='num')v=(v===''?null:Number(v)); d[f[1]]=v; });
  if(!d.cust||!String(d.cust).trim()){ toast('거래처를 입력하세요'); return; }
  if(!d.bizRaw)d.bizRaw=d.biz||'';
  let no=c?c.no:null, id=c?c._id:null;
  if(!id){ no=(ROWS.reduce((m,r)=>Math.max(m,r.no||0),0))+1; d.no=no; }
  _ksSaving=true;
  const _btn=document.getElementById('cf-save'); if(_btn){_btn.disabled=true;_btn.style.opacity=.6;}
  try{ await saveData(id,no,d,c?'수정 완료':'신규 등록 완료',no); }
  finally{ _ksSaving=false; if(_btn){_btn.disabled=false;_btn.style.opacity='';} }
}
async function deleteContract(no){ const c=ROWS.find(r=>r.no===no); if(!c||!c._id){toast('삭제할 수 없습니다');return;} if(!confirm('#'+no+' '+c.cust+' 계약을 삭제할까요?\n(삭제 후 아래 실행취소로 복구할 수 있어요)'))return;
  const d=Object.assign({},c); delete d._id; delete d._month; d._deleted=true;
  try{ const {error}=await _sb.from('kor_contracts').update({data:d,updated_at:new Date().toISOString(),updated_by:MENAME}).eq('id',c._id); if(error)throw error; }catch(e){ toast('삭제 실패'); return; }
  await loadData(); initFilters(); buildNav(); closeModal(); render();
  undoToast('삭제됨 · #'+no+' '+c.cust, c._id);
}
async function restoreContract(id){ try{ const rows=(await _sb.from('kor_contracts').select('id,data').eq('id',id)).data; if(rows&&rows[0]){ const d=rows[0].data||{}; delete d._deleted; const {error}=await _sb.from('kor_contracts').update({data:d,updated_at:new Date().toISOString(),updated_by:MENAME}).eq('id',id); if(error)throw error; } }catch(e){ toast('복구 실패'); return; } toast('복구되었습니다'); await loadData(); initFilters(); buildNav(); render(); }
function undoToast(msg,id){ const t=document.getElementById('toast'); t.innerHTML=esc(msg)+' <button onclick="restoreContract('+id+');document.getElementById(\'toast\').style.display=\'none\'" style="margin-left:10px;background:#fff;color:var(--ink);border:none;border-radius:6px;padding:3px 11px;font-size:12px;font-weight:700;cursor:pointer">실행취소</button>'; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>{t.style.display='none';t.innerHTML='';},9000); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function quickDeliver(no){ const c=ROWS.find(r=>r.no===no); if(!c)return; const d=Object.assign({},c); delete d._id; delete d._month; d.dDelivered=todayStr(); if(['미납','납품','미분류',''].indexOf(d.status||'')>=0)d.status='완료'; await saveData(c._id,no,d,'납품완료 처리',no); }
let _coupType='전체';

function bulkPay(){ const n=window.__coupSel.size; if(!n)return;

    '<div class="mbody"><div class="cform"><div class="cf"><label>지급일</label><input id="bk-date" type="date" class="form-control form-control-sm" value="'+todayStr()+'"></div><div class="cf"><label>수량 (선택 · 전체 동일 적용)</label><input id="bk-qty" class="form-control form-control-sm" placeholder="비우면 수량 미기재"></div></div>'+

async function saveBulk(){ const date=document.getElementById('bk-date').value; const qty=(document.getElementById('bk-qty').value||'').trim(); if(!date){toast('지급일을 선택하세요');return;}

    try{ const {error}=await _sb.from('kor_contracts').update({data:d,updated_at:new Date().toISOString(),updated_by:MENAME}).eq('id',c._id); if(!error)ok++; }catch(e){} }

    '<div class="cform-foot"><span></span><div style="display:flex;gap:8px"><button class="btn btn-outline-secondary btn-sm" onclick="closeModal()">취소</button><button class="btn btn-primary btn-sm" onclick="saveCoupon('+no+')"><i class="bi bi-check-lg"></i> 지급 저장</button></div></div></div>';

async function saveCoupon(no){ const c=ROWS.find(r=>r.no===no); if(!c)return; const d=Object.assign({},c); delete d._id; delete d._month; d.couponDate=document.getElementById('cf-couponDate').value; d.couponQty=document.getElementById('cf-couponQty').value; await saveData(c._id,no,d,'지급 기록 완료',no); }
async function saveData(id,no,d,msg,reopenNo){
  try{ if(id){ const {error}=await _sb.from('kor_contracts').update({data:d,no:no,updated_at:new Date().toISOString(),updated_by:MENAME}).eq('id',id); if(error)throw error; }
       else { const {error}=await _sb.from('kor_contracts').insert({no:no,data:d,updated_by:MENAME}); if(error)throw error; } }
  catch(e){ toast('저장 실패: '+(e.message||'')); return; }

  ROWS.forEach(function(site){
    const needPay=!has(site.payDate), needComm=(site.commAmount==null||site.commAmount==='');
    if(!needPay&&!needComm)return; // 둘 다 이미 채워져 있으면 건드리지 않음
    const sc=xfNormCust(site.cust),sp=xfNormProduct(site.product),sa=Number(site.amount);
    let cands=[];
    if(site.shipReqNo&&byShipRef[site.shipReqNo])cands=byShipRef[site.shipReqNo].slice();
    if(cands.length>1){
      const narrowed=cands.filter(function(p){return xfNormCust(p.cust)===sc&&xfNormProduct(p.product)===sp;});
      if(narrowed.length)cands=narrowed;
    }
    if(!cands.length){
      // 사이트에 출고요청서 번호가 없거나(또는 이 파일에서 못 찾음) — 거래처+제품명+금액으로 대체 매칭
      cands=rows.filter(function(p){
        const pc=xfNormCust(p.cust);
        if(sc!==pc&&sc.indexOf(pc)<0&&pc.indexOf(sc)<0)return false;
        if(xfNormProduct(p.product)!==sp)return false;
        if(Number(p.amount)!==sa)return false;
        return true; });
    }
    if(!cands.length)return; // 이 파일에서 매칭되는 행 없음 — 조용히 건너뜀
    if(cands.length>1){ ambiguous.push({no:site.no,cust:site.cust,product:site.product,n:cands.length}); return; }
    const m=cands[0];
    const patch={};
    if(needPay&&has(m.payDate))patch.payDate=m.payDate;
    if(needComm&&m.commAmount!=null)patch.commAmount=m.commAmount;
    if(!Object.keys(patch).length)return; // 매칭은 됐지만 엑셀 쪽도 비어있어 채울 값이 없음
    toFill.push({id:site._id,no:site.no,cust:site.cust,product:site.product,amount:site.amount,patch:patch,shipRef:m.shipRef||''});
  });
  return {toFill:toFill,ambiguous:ambiguous,totalRows:rows.length};
}

async function onXlsxFile(evt){
  const file=evt.target.files&&evt.target.files[0]; if(!file)return;
  const fn=document.getElementById('xf-fname'); if(fn)fn.textContent=file.name;
  const res=document.getElementById('xf-result'); if(!res)return;
  res.innerHTML='<div class="mut" style="font-size:12px;padding:10px 0"><i class="bi bi-hourglass-split"></i> 분석 중…</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const foundComm=xfFindCommSheet(wb);
    if(foundComm){
      const range2=XLSX.utils.decode_range(foundComm.ws['!ref']);
      const cm2=xfBuildColMap(foundComm.ws,foundComm.headerRow,range2,XF2_HEADER_MAP);
      const rawRows2=xfExtractRows(foundComm.ws,foundComm.headerRow,cm2.map,range2);
      if(rawRows2.length){
        const parsed2=rawRows2.map(xfParseCommRow);
        const diff2=xfBuildCommDiff(parsed2);
        diff2.sheetName=foundComm.name;
        window.__xfCommDiff=diff2;
        renderCommPreview(diff2);
        evt.target.value='';
        return;
      }
    }
    const found=xfFindSheet(wb);
    if(!found){ res.innerHTML='<div class="empty">엑셀에서 "거래처"·"사업자등록번호" 컬럼이 있는 표(계약 리스트) 또는 "거래처"·"품명"·"입금일"·"일반 지출 결의서 문서번호" 컬럼이 있는 표(수수료 정리)를 찾지 못했습니다. 지원되는 파일이 맞는지 확인해주세요.</div>'; return; }
    const range=XLSX.utils.decode_range(found.ws['!ref']);
    const cm=xfBuildColMap(found.ws,found.headerRow,range);
    const fields=Object.keys(cm.map).map(k=>cm.map[k]);
    if(fields.indexOf('cust')<0||fields.indexOf('no')<0){ res.innerHTML='<div class="empty">필수 컬럼(NO·거래처)을 찾지 못했습니다.</div>'; return; }
    const rawRows=xfExtractRows(found.ws,found.headerRow,cm.map,range);
    if(!rawRows.length){ res.innerHTML='<div class="empty">"'+esc(found.name)+'" 시트에서 데이터 행을 찾지 못했습니다.</div>'; return; }
    const parsed=rawRows.map(xfParseRow);
    const diff=xfBuildDiff(parsed);
    diff.sheetName=found.name; diff.unmapped=cm.unmapped;
    window.__xfDiff=diff;
    renderUploadPreview(diff);

  evt.target.value='';
}

function detectChanges(){

    ROWS.forEach(r=>{ cur[r.no]=(has(r.dDelivered)?'D':'_')+(/취소/.test((r.status||'')+(r.pay||''))?'X':''); });
    let prev=null; try{ prev=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
    const chg={neo:[],del:[],can:[]};
    if(prev&&prev.map){ ROWS.forEach(r=>{ const p=prev.map[r.no], c=cur[r.no];
      if(p===undefined){ chg.neo.push(r); }
      else{ if(p[0]!=='D'&&c[0]==='D')chg.del.push(r); if(p.indexOf('X')<0&&c.indexOf('X')>=0)chg.can.push(r); } }); }
    window.__chg=(prev&&prev.map)?chg:null;
    localStorage.setItem(key,JSON.stringify({rev:DATA.updatedAt||'',map:cur}));
  }catch(e){ window.__chg=null; }
}

async function renderSwitcher(){
  let reg=[]; try{ reg=(await _sb.from('site_registry').select('*').order('sort_order')).data||[]; }catch(e){}
  let ac=[],ad=false,stf=false; try{ const s=(await _sb.auth.getSession()).data.session; if(s&&s.user){ if(s.user.email==='master@demo.local')ad=true; const p=await _sb.from('crm_profiles').select('access,role,dept').eq('id',s.user.id).maybeSingle(); if(p&&p.data){ac=(p.data.access||'').split(',').map(x=>x.trim()).filter(Boolean); if(p.data.role==='admin')ad=true; stf=String(p.data.dept||'').replace(/\s/g,'').includes('영업전략');} } }catch(e){}
  const vis=s=>{ if(ac.indexOf(s.key)>=0)return true; if(s.admin_bypass&&ad)return true; if(s.extra_visible_rule){try{return !!((function(){return false;}))(ac,ad,stf);}catch(e){return false;}} return false; };
  const seen={}; const items=reg.filter(s=>{ if(s.key==='kor_sales')return false; if(!vis(s))return false; const d=(s.url==='LOCAL'||s.key==='korea')?'central':s.url; if(seen[d])return false; seen[d]=1; return true; });
  document.getElementById('sw-dd').innerHTML='<div class="dd-head">사이트 이동</div>'+(items.map((s,i)=>'<div class="dd-item" onclick="swGo('+i+')"><span class="bdg" style="background:'+(s.grad_from||'#64748b')+'">'+esc(s.badge||'')+'</span>'+esc(s.title||s.key)+'</div>').join('')||'<div class="dd-item mut">이동 가능한 사이트 없음</div>');
  window._swItems=items;
}
async function swGo(i){ const s=window._swItems[i]; if(!s)return; let u=(s.url==='LOCAL'||s.key==='korea')?CENTRAL:s.url; let sess=null; try{sess=(await _sb.auth.getSession()).data.session;}catch(e){} if(sess&&u.indexOf('#')<0)u+='#at='+encodeURIComponent(sess.access_token)+'&rt='+encodeURIComponent(sess.refresh_token); location.href=u; }

(function w(){ if(typeof supabase==='undefined'){setTimeout(w,120);return;} boot(); })();
</script>
<script>/* WT_UPDATE_V1 — 새 버전 감지 시 상단 새로고침 바 (전 사이트 공통 스니펫, 개별 수정 금지) */
(function(){var base=null;
function bar(){if(document.getElementById('wt-upd'))return;var d=document.createElement('div');d.id='wt-upd';
d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483000;background:#16324f;color:#fff;font-family:inherit;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25)';
d.innerHTML='<i class="bi bi-arrow-clockwise"></i><span>새 버전이 배포되었습니다.</span><button onclick="location.reload()" style="background:#fff;color:#16324f;border:none;border-radius:7px;padding:4px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit">지금 새로고침</button><button onclick="this.parentNode.remove()" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit">나중에</button>';
document.body.appendChild(d);}
function et(){return fetch(location.pathname+'?uchk='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(r){return r.headers.get('etag')||r.headers.get('last-modified')||'';}).catch(function(){return null;});}
function chk(){et().then(function(e){if(e==null||e==='')return;if(base===null){base=e;return;}if(e!==base)bar();});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)chk();});
setInterval(chk,5*60*1000);chk();
})();</script>
<script>/* WT_FORCEPW_V1 — 임시비번 강제변경 (자동주입 스니펫, 개별 수정 금지) */
(function(){
var MASTER='master@demo.local';var shown=false;
function ov(){if(document.getElementById('wtfpw'))return document.getElementById('wtfpw');
var d=document.createElement('div');d.id='wtfpw';
d.style.cssText='position:fixed;inset:0;z-index:2147483647;background:linear-gradient(135deg,#0f172a,#1e2140);display:none;align-items:center;justify-content:center;font-family:inherit';
d.innerHTML='<div style="background:#fff;border-radius:20px;padding:34px 30px;width:min(340px,92vw);box-shadow:0 25px 60px rgba(0,0,0,.4)"><div style="text-align:center;margin-bottom:16px"><div style="width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;font-size:24px">\uD83D\uDD12</div><div style="font-size:19px;font-weight:800;color:#111827">\uBE44\uBC00\uBC88\uD638 \uBCC0\uACBD \uD544\uC694</div><div style="font-size:12px;color:#6b7280;margin-top:6px;line-height:1.5">\uBCF4\uC548\uC744 \uC704\uD574 \uC784\uC2DC \uBE44\uBC00\uBC88\uD638\uB97C<br>\uBCF8\uC778\uB9CC \uC544\uB294 \uBE44\uBC00\uBC88\uD638\uB85C \uBCC0\uACBD\uD574\uC8FC\uC138\uC694.</div></div><input id="wtfpw-a" type="password" placeholder="\uC0C8 \uBE44\uBC00\uBC88\uD638 (6\uC790 \uC774\uC0C1)" style="width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:11px 12px;font-size:14px;color:#111827;margin-bottom:10px;box-sizing:border-box"><input id="wtfpw-b" type="password" placeholder="\uC0C8 \uBE44\uBC00\uBC88\uD638 \uD655\uC778" style="width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:11px 12px;font-size:14px;color:#111827;margin-bottom:12px;box-sizing:border-box"><div id="wtfpw-e" style="font-size:12px;color:#dc2626;margin-bottom:10px;display:none"></div><button id="wtfpw-btn" style="width:100%;background:#0d9488;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer">\uBCC0\uACBD\uD558\uACE0 \uC2DC\uC791\uD558\uAE30</button><div style="text-align:center;margin-top:12px"><span id="wtfpw-out" style="font-size:12px;color:#9ca3af;cursor:pointer">\uB098\uC911\uC5D0 \uD558\uAE30 (\uB85C\uADF8\uC544\uC6C3)</span></div></div>';
document.body.appendChild(d);
d.querySelector('#wtfpw-btn').onclick=submit;
d.querySelector('#wtfpw-out').onclick=function(){try{_sb.auth.signOut();}catch(e){}location.reload();};
d.querySelector('#wtfpw-b').onkeydown=function(ev){if(ev.key===String.fromCharCode(69,110,116,101,114))submit();};
return d;}
async function submit(){var a=document.getElementById('wtfpw-a').value,b=document.getElementById('wtfpw-b').value,e=document.getElementById('wtfpw-e');e.style.display='none';
if(a.length<6){e.textContent='\uBE44\uBC00\uBC88\uD638\uB294 6\uC790 \uC774\uC0C1\uC774\uC5B4\uC57C \uD569\uB2C8\uB2E4.';e.style.display='block';return;}
if(a!==b){e.textContent='\uBE44\uBC00\uBC88\uD638\uAC00 \uC77C\uCE58\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.';e.style.display='block';return;}
var btn=document.getElementById('wtfpw-btn');btn.disabled=true;btn.textContent='\uBCC0\uACBD \uC911...';
try{var r=await _sb.auth.updateUser({password:a});if(r.error){btn.disabled=false;btn.textContent='\uBCC0\uACBD\uD558\uACE0 \uC2DC\uC791\uD558\uAE30';e.textContent='\uC624\uB958: '+r.error.message;e.style.display='block';return;}
var s=(await _sb.auth.getSession()).data.session;if(s)await _sb.from('crm_profiles').update({temp_pw:null}).eq('id',s.user.id);location.reload();
}catch(ex){btn.disabled=false;btn.textContent='\uBCC0\uACBD\uD558\uACE0 \uC2DC\uC791\uD558\uAE30';e.textContent='\uC624\uB958: '+ex;e.style.display='block';}}
async function chk(){if(shown)return;try{var s=(await _sb.auth.getSession()).data.session;if(!s||!s.user)return;if(s.user.email===MASTER)return;
var r=await _sb.from('crm_profiles').select('temp_pw').eq('id',s.user.id).single();
if(r.data&&r.data.temp_pw&&String(r.data.temp_pw).trim()){shown=true;ov().style.display='flex';setTimeout(function(){var i=document.getElementById('wtfpw-a');if(i)i.focus();},100);}}catch(e){}}
function boot(){if(typeof _sb==='undefined'||!_sb||!_sb.auth){setTimeout(boot,300);return;}chk();try{_sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_IN')setTimeout(chk,300);});}catch(e){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();</script>
