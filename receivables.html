<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23b45309'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>₩</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script>
/* ═══ Chart.js y축 눈금 최적화 (WT_YFIT) ══════════════════════════════
   문제: 데이터가 25~30억 구간인데 y축이 0~35억 → 아래 절반이 빈 공간.
   해결: 선/추이 차트는 데이터 min~max 기준 ±15% 패딩(0 강제 안 함),
         막대·누적·혼합 차트는 면적 왜곡 방지를 위해 0 기준 유지 + 상단 12% 여백만.
   사용: Chart 생성 시 설정 객체 전체를 _yFit( ... ) 으로 감싼다.
   기존 ticks.callback(억/만원 포맷)·grid·stacked 등은 건드리지 않고
   suggestedMin / suggestedMax 만 병합한다. (min·max가 명시된 축은 제외) */
function _yNums(arr){
  var o=[];
  (arr||[]).forEach(function(v){
    if(v&&typeof v==='object') v=(v.y!==undefined?v.y:v.value);
    if(v===null||v===undefined||v==='') return;
    var n=Number(v); if(isFinite(n)) o.push(n);
  });
  return o;
}
function _ySum(arrs){
  var n=0; (arrs||[]).forEach(function(a){ if(a&&a.length>n) n=a.length; });
  var out=[];
  for(var i=0;i<n;i++){ var s=0; (arrs||[]).forEach(function(a){ var v=Number(a&&a[i]); if(isFinite(v)) s+=v; }); out.push(s); }
  return out;
}
/* 선(line)·추이 차트용 — 0에서 시작하지 않고 데이터 범위에 맞춤 */
function _yScale(datasets){
  var a=[]; (datasets||[]).forEach(function(d){ a=a.concat(_yNums(d&&d.data?d.data:d)); });
  if(!a.length) return {};
  var mn=Math.min.apply(null,a), mx=Math.max.apply(null,a), rg=mx-mn, lo, hi;
  if(rg>0){ lo=mn-rg*0.15; hi=mx+rg*0.15; }
  else if(mx!==0){ var m=Math.abs(mx); lo=mn-m*0.1; hi=mx+m*0.1; }   // 전부 같은 값
  else return {suggestedMin:0, suggestedMax:1};                       // 전부 0
  if(mn>=0) lo=Math.max(0,lo);                                        // 양수 데이터는 음수로 안 내려감
  if(!isFinite(lo)||!isFinite(hi)||hi<=lo) return {};
  return {suggestedMin:Math.round(lo*1e4)/1e4, suggestedMax:Math.round(hi*1e4)/1e4};
}
/* 막대(bar)·누적·혼합 차트용 — 0 기준 유지, 상단 여백만 */
function _yScale0(datasets){
  var a=[]; (datasets||[]).forEach(function(d){ a=a.concat(_yNums(d&&d.data?d.data:d)); });
  var o={beginAtZero:true};
  if(!a.length) return o;
  var mx=Math.max.apply(null,a), mn=Math.min.apply(null,a);
  if(mx>0) o.suggestedMax=Math.round(mx*1.12*1e4)/1e4;
  if(mn<0) o.suggestedMin=Math.round(mn*1.12*1e4)/1e4;
  return o;
}
/* Chart 설정 객체를 받아 y축(y, y1, y2 …)마다 위 규칙을 적용해 그대로 반환 */
function _yFit(cfg){
  try{
    if(!cfg||!cfg.data) return cfg;
    var ds=cfg.data.datasets||[]; if(!ds.length) return cfg;
    if(/^(doughnut|pie|polarArea|radar|bubble|scatter)$/.test(cfg.type||'')) return cfg;
    cfg.options=cfg.options||{};
    if((cfg.options.indexAxis||'x')!=='x') return cfg;                 // 가로막대는 대상 아님
    cfg.options.scales=cfg.options.scales||{};
    var sc=cfg.options.scales;
    var keys=Object.keys(sc).filter(function(k){ return /^y/i.test(k); });
    if(!keys.length){ sc.y={}; keys=['y']; }
    keys.forEach(function(k){
      var ax=sc[k]; if(!ax||typeof ax!=='object') return;
      if(ax.min!==undefined||ax.max!==undefined) return;               // 명시 범위 존중
      if(ax.type==='category'||ax.display===false) return;
      var mine=ds.filter(function(d){ return (d.yAxisID||'y')===k; });
      if(!mine.length) return;
      var typeOf=function(d){ return d.type||cfg.type||'bar'; };
      var hasBar=mine.some(function(d){ return typeOf(d)==='bar'; });
      if(!hasBar){                                                     // 선 전용 축
        var r=_yScale(mine);
        if(ax.beginAtZero===true) delete ax.beginAtZero;
        if(r.suggestedMin!==undefined&&ax.suggestedMin===undefined) ax.suggestedMin=r.suggestedMin;
        if(r.suggestedMax!==undefined&&ax.suggestedMax===undefined) ax.suggestedMax=r.suggestedMax;
        return;
      }
      // 막대 포함(혼합·누적) → 0 기준. 누적이면 스택 합계로 상단 여백 계산
      var groups={}, uid=0;
      mine.forEach(function(d){
        var stacked = typeOf(d)==='bar' && ax.stacked!==false && (ax.stacked===true || d.stack!==undefined);
        var key = stacked ? ('s:'+(d.stack||'_')) : ('u:'+(uid++));
        (groups[key]=groups[key]||[]).push(d.data||[]);
      });
      var series=Object.keys(groups).map(function(key){
        var g=groups[key]; return g.length>1?_ySum(g):g[0];
      });
      var r0=_yScale0(series);
      if(ax.beginAtZero===undefined) ax.beginAtZero=true;
      if(r0.suggestedMax!==undefined&&ax.suggestedMax===undefined) ax.suggestedMax=r0.suggestedMax;
      if(r0.suggestedMin!==undefined&&ax.suggestedMin===undefined) ax.suggestedMin=r0.suggestedMin;
    });
  }catch(e){ }
  return cfg;
}
</script>

<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--line2:#f1f3f5;--ink:#111827;--body:#475569;--muted:#6b7280;--brand:#2563eb;--ok:#15803d;--bad:#b91c1c;--sh:0 1px 3px rgba(16,42,67,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--body);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.1px;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#64748b;font-size:14px;z-index:50}
#app{display:none}
/* 상단 헤더(일보 스타일) */
.hdr{position:sticky;top:0;z-index:40;background:#fff;color:#111827;border-bottom:1px solid #e5e7eb}
.hdr-in{max-width:none;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand .lg{width:37px;height:37px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 5px 14px rgba(37,99,235,.3)}
.brand b{color:#111827;font-size:14.5px;font-weight:800;display:block;line-height:1.1}.brand small{display:block;color:#64748b;font-size:10.5px;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:9px;margin-left:auto}
.hbtn{background:#fff;border:1px solid #dbe3ec;border-radius:9px;padding:8px 12px;color:#475569;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.hbtn:hover{background:#eff4fb;border-color:#a9c4e8;color:#2563eb}
.acctbtn{background:#fff;border:1px solid #dbe3ec;border-radius:11px;padding:4px 11px 4px 4px;display:flex;align-items:center;gap:8px;color:#334155}
.acctbtn:hover{background:#eff4fb;border-color:#a9c4e8}
.acctbtn .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.acctbtn .who{text-align:left;line-height:1.2}.acctbtn .nm{font-size:12px;font-weight:700;color:#111827;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acctbtn .em{font-size:10px;color:#6b7280;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-wrap{position:relative}
.dd{display:none;position:absolute;top:122%;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 16px 42px rgba(16,42,67,.16);z-index:50;padding:6px;min-width:220px}
.dd.open{display:block}
.dd>button{width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:9px 11px;font-size:13px;color:#475569;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.dd>button:hover{background:#f1f5f9;color:#2563eb}
.sw-item{border-radius:8px;padding:9px 10px;display:flex;align-items:center;gap:9px;color:#475569;font-size:12.5px;cursor:pointer;font-weight:600}
.sw-item:hover{background:#f1f5f9;color:#2563eb}
.sw-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:19px;color:#fff;border-radius:6px;font-size:10px;font-weight:700;padding:0 5px;flex-shrink:0}
.nav{max-width:none;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid #eef2f7}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:7px;padding:11px 14px 12px;font-size:13.5px;font-weight:600;color:#64748b;border-bottom:2.5px solid transparent;white-space:nowrap;cursor:pointer;text-decoration:none}
.nav a .ico{font-size:15px}
.nav a:hover{color:#111827}
.nav a.active{color:#2563eb;border-bottom-color:#2563eb}
/* 메인 */
#main{max-width:none;min-height:60vh}
.pagetitle{padding:22px 24px 2px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagetitle h2{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.pagetitle .desc{color:var(--muted);font-size:12.5px;margin-top:4px}
.wrap{padding:22px 30px 60px}
.sec{font-size:15px;font-weight:700;color:var(--ink);margin:6px 0 14px;display:flex;align-items:center;gap:8px}
.hint{font-size:11.5px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kpi.clk{cursor:pointer}.kpi.clk:hover{border-color:#cbd5e1}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:22px;font-weight:800;color:var(--ink);margin-top:6px;line-height:1}
.kpi .s{font-size:11px;margin-top:6px;font-weight:600;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh);margin-bottom:18px}
.up{color:var(--ok)}.dn{color:var(--bad)}.mut{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--body);box-shadow:var(--sh)}
.btn:hover{border-color:#cbd5e1}
.btn.pri{background:#0f172a;color:#fff;border-color:#0f172a}
.btn.warn{background:#b45309;color:#fff;border-color:#b45309}
.sel,.inp{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;background:#fff;color:var(--body)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;position:sticky;top:100px;z-index:20;background:var(--bg);padding:8px 0}
/* 표 */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th,.dt td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:right;white-space:nowrap}
.dt th{color:var(--muted);font-weight:600;font-size:11px;background:#fafbfc;position:sticky;top:0}
.dt th.sortable{cursor:pointer}.dt th.sortable:hover{color:var(--ink)}
.dt td.l,.dt th.l{text-align:left}
.dt td.l b{color:var(--ink);font-weight:600}
.dt tr.clk{cursor:pointer}.dt tr.clk:hover td{background:#fdf8f1}
.dt .memo{max-width:260px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px}
.rt th,.rt td{border:1px solid var(--line);padding:7px 10px;text-align:right;white-space:nowrap}
.rt thead th{background:#eef2f6;color:#475569;font-weight:700;font-size:11.5px;text-align:center}
.rt td.lbl,.rt th.lbl{text-align:left}
.rt tr.grand td{background:#0f172a;color:#fff;font-weight:800}
.rt tr.hl:hover td{background:#fdf8f1;cursor:pointer}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:24px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mhd h3{font-size:17px;color:var(--ink);font-weight:800}
.mhd .x{border:0;background:#f1f3f5;width:30px;height:30px;border-radius:8px;color:#64748b;font-size:16px;flex-shrink:0}
.mbody{padding:18px 22px 24px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin-bottom:14px}
.fld label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.fld .fv{font-size:13px;color:var(--ink);font-weight:600;word-break:break-all}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.fld textarea{resize:vertical;min-height:56px}
.editable-note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:14px}
/* 로그인 */
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#292018);z-index:60;padding:16px}
.lc{background:#fff;border-radius:18px;padding:40px 34px;width:350px;max-width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lc h1{font-size:18px;text-align:center;color:#0f172a}.lc .sub{text-align:center;color:#94a3b8;font-size:13px;margin:4px 0 22px}
.lc input{width:100%;padding:12px 14px;border:1px solid #e8ebf0;border-radius:10px;margin-bottom:11px}
.lc button{width:100%;padding:12px;border:0;border-radius:10px;background:#b45309;color:#fff;font-weight:700}
#login-err{color:#b91c1c;font-size:12.5px;text-align:center;margin-top:10px;display:none}
/* 토스트 */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* 임원 보고(인쇄) */
.rpt{max-width:none}
.rpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;align-items:start}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;align-items:start}
@media(max-width:1150px){.rpt-grid,.qa-grid{display:block}}
@media print{.rpt-grid,.qa-grid{display:block}}
.rpt h1{font-size:20px;color:var(--ink);text-align:center;margin-bottom:2px}
.rpt .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
.rpt h4{font-size:14.5px;color:var(--ink);margin:22px 0 10px;padding-left:9px;border-left:4px solid var(--brand)}
.rpt .sumline{font-size:13px;color:var(--ink);padding:6px 0;line-height:1.55}
.rpt .concl{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--ink);font-weight:600;line-height:1.6;margin-top:18px}
@media print{
  .hdr,.pagetitle .actions,#pdf-fab,#wt-fb-btn,#wt-fb-panel,.noprint{display:none!important}
  body{background:#fff}
  .wrap{padding:0}
  .card{border:0;box-shadow:none;padding:8px 0}
  #main{max-width:100%}
}
#pdf-fab{position:fixed;right:18px;bottom:18px;z-index:9990;background:#0f172a;color:#fff;border:0;border-radius:24px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px}
canvas.chart{max-height:300px}
/* 잔여 미수금 히어로 + 처리 레인 */
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;box-shadow:var(--sh);margin-bottom:16px}
.hero .hv{font-size:38px;font-weight:800;color:var(--ink);line-height:1}
.hero .formula{font-size:12.5px;color:var(--muted);margin-top:8px}
.hero .formula b{color:var(--ink)}
.sbar{display:flex;height:28px;border-radius:9px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.sbar>div{cursor:pointer;min-width:6px;transition:opacity .15s}
.sbar>div:hover{opacity:.8}
.sbar-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:10px}
.sbar-leg .li{display:flex;align-items:center;gap:6px;cursor:pointer}
.sbar-leg .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-bottom:18px}
.lane{background:#fff;border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:14px;padding:14px 16px 10px;box-shadow:var(--sh)}
.lane .ln-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;color:var(--ink);font-size:13.5px}
.lane .ln-amt{font-size:20px;font-weight:800;white-space:nowrap}
.lane .ln-sub{font-size:11px;color:var(--muted);margin:3px 0 8px}
.ln-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:12.5px;cursor:pointer;color:var(--body)}
.ln-row:last-child{border-bottom:0}
.ln-row:hover{background:#f8fafc}
.ln-row b{color:var(--ink);white-space:nowrap}
.ln-row .zero{color:var(--muted);font-weight:600}
/* 회계 요약 스트립 */
.accstrip{display:flex;gap:22px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;box-shadow:var(--sh);margin-bottom:18px;font-size:12.5px;color:var(--muted)}
.accstrip b{color:var(--ink);font-size:14px;margin-left:4px}
.accstrip .as{cursor:pointer}
.accstrip .as:hover b{color:var(--brand)}
/* 조치 필요(액션) 카드 */

function typeAgg(rows){const m={};rows.forEach(r=>{const t=(r.type&&TYPE_ORDER.indexOf(r.type)>=0)?r.type:'미분류';m[t]=m[t]||{cnt:0,ar:0,prov:0,rows:[]};m[t].cnt++;m[t].ar+=r.ar;m[t].prov+=r.prov;m[t].rows.push(r);});return m;}
function yearAgg(rows){const m={};rows.forEach(r=>{const y=r.year||'?';m[y]=m[y]||{cnt:0,amt:0,ar:0,prov:0};m[y].cnt++;m[y].amt+=r.amt;m[y].ar+=r.ar;m[y].prov+=r.prov;});return m;}
function kpis(){
  const tot=E.reduce((s,r)=>s+r.amt,0),coll=E.reduce((s,r)=>s+r.coll,0),bad=E.reduce((s,r)=>s+r.bad,0);
  const arSum=E.reduce((s,r)=>s+r.ar,0),prov=E.reduce((s,r)=>s+r.prov,0);
  const ta=typeAgg(E);
  const delay=(ta['지연채권']||{ar:0,prov:0});const lt=(ta['장기체납채권']||{ar:0,prov:0});
  const risk=delay.ar-delay.prov+(lt.ar-lt.prov); // 실질 관리필요 = 지연 잔여위험 + 장기체납 잔여위험
  return{tot,coll,bad,arSum,prov,ta,risk,collRate:tot?coll/tot:0,collRateB:tot?(coll+bad)/tot:0};
}
function weeklyDelta(){const w=(RAW&&RAW.weekly)||[];if(w.length<2)return null;const a=w[w.length-1],b=w[w.length-2];return{d:a.d,pd:b.d,ar:a.ar-b.ar,cnt:a.cnt-b.cnt,coll:a.coll-b.coll};}
function lastChange(){const c=(RAW&&RAW.changes)||[];return c.length?c[c.length-1]:null;}
const AGING_B=[{k:'6개월 미만',max:183},{k:'6~12개월',max:366},{k:'1~3년',max:1096},{k:'3년 이상',max:1e15}];
function agingIdx(r){if(!r.saleDate)return 3;const days=Math.floor((new Date(RAW.asOf)-new Date(r.saleDate))/864e5);return days<183?0:days<366?1:days<1096?2:3;}
function agingBuckets(){const out=AGING_B.map(b=>({k:b.k,cnt:0,ar:0}));E.filter(r=>r.ar>0).forEach(r=>{const i=agingIdx(r);out[i].cnt++;out[i].ar+=r.ar;});return out;}
function isNoMgr(r){return r.ar>0&&(!r.mgr||r.mgr==='(미배정)');}
function isNoPlan(r){return r.ar>0&&!(r.plan||'').trim()&&r.type!=='정상채권';}
function hasMgrConflict(r){return r.ar>0&&!!r._mgrConflict;}
function isFollowDue(r){return r.ar>0&&!!r.nextDate&&r.nextDate<=today();}
function hasFollow(r){return r.ar>0&&!!r.nextDate;}
function mgrAgg(){const m={};E.filter(r=>r.ar>0).forEach(r=>{const g=r.mgr||'(미배정)';m[g]=m[g]||{cnt:0,ar:0,delay:0,noplan:0,oldest:''};m[g].cnt++;m[g].ar+=r.ar;
  if(r.type==='지연채권'||r.type==='장기체납채권')m[g].delay++;
  if(isNoPlan(r))m[g].noplan++;
  if(!m[g].oldest||r.saleDate<m[g].oldest)m[g].oldest=r.saleDate;});
  // 회수율: 잔액 유무와 무관하게 담당 전체 채권 기준(수금 완료분 포함)이라야 실적이 된다
  E.forEach(r=>{const g=r.mgr||'(미배정)';if(!m[g])return;m[g].amt=(m[g].amt||0)+r.amt;m[g].collAmt=(m[g].collAmt||0)+r.coll;});
  return Object.keys(m).map(k=>Object.assign({mgr:k,rate:m[k].amt>0?m[k].collAmt/m[k].amt:null},m[k])).sort((a,b)=>b.ar-a.ar);}

const WO_ST={confirm:{l:'대손 확정(품의)',c:'#b91c1c',bg:'#fee2e2'},sue:{l:'소송 회수 추진',c:'#6d28d9',bg:'#ede9fe'},hold:{l:'보류(추심 지속)',c:'#b45309',bg:'#fef3c7'},skip:{l:'대상 제외',c:'#64748b',bg:'#f1f5f9'}};
let _woMode='list', _woF='';
function woOf(r){const e=EDITS[r.rid];return (e&&e.wo)||null;}
function woReasons(r){
  const mi=M.find(i=>i.rid===r.rid);const rs=[];
  if(mi&&mi.cls==='관리제외')rs.push('관리대상: 관리제외');
  if(/폐업/.test(r.name)||r.trait==='폐업')rs.push('거래처 폐업');
  if(/회수불가/.test(r.dueNote||''))rs.push('지급기일: 회수불가');
  if(/대손/.test(r.opinion||''))rs.push('실무의견: 대손');
  if(r.ar>0&&r.prov>=r.ar*0.999)rs.push('충당금 100%');
  if(/폐업/.test(r.mgr||''))rs.push('담당 대리점 폐업');
  const yrs=r.saleDate?Math.floor((new Date(RAW.asOf)-new Date(r.saleDate))/(365.25*864e5)):0;
  if(yrs>=5)rs.push(yrs+'년 경과');
  else if(yrs>=3&&r.type==='장기체납채권')rs.push(yrs+'년 경과');
  return rs;
}
// 우선순위 등급: "사건 발생여부 + 충당금 커버율" 2요소로 손실처리 후보를 2등급으로 분류.
// (예전엔 "최근 상환활동"으로 별도 요주의급을 뒀으나, 관리대상 메모의 "최근입금 확인" 문구가
// 실제로는 몇 년째 방치된 경우가 확인되어 폐지.)
// ⚠재확인 배지는 충당완료급에만 붙인다 — 회수의문급은 등급 자체가 이미 "개별검토 필요"라
// 배지가 중복이지만, 충당완료급은 원래 "안전하니 바로 처리"라는 뜻이라 입금기록이 있으면
// 그 전제가 흔들리는 것이므로 별도로 짚어줄 가치가 있다.
function woTier(r){
  const mi=M.find(i=>i.rid===r.rid);
  const txt=((mi&&mi.basis)||'')+' '+(r.plan||'')+' '+(r.payNote||'');
  const hasPayKeyword=/분납|입금|완제/.test(txt);
  const collAgeDays=r.collDate?(new Date((RAW&&RAW.asOf)||today())-new Date(r.collDate))/86400000:null;
  const recentColl=collAgeDays!=null&&collAgeDays<=365;
  const hasEvent=/폐업/.test(r.name)||r.trait==='폐업'||r.trait==='도주'||(mi&&mi.cls==='관리제외');
  const fullProv=r.ar>0&&r.prov>=r.ar*0.999;
  if(hasEvent&&fullProv){
    let warn='';
    if(hasPayKeyword){
      warn=recentColl?`⚠ 최근 수금 있음(${r.collDate}) — 상환 진행 중일 수 있어 확정 전 재확인 권장`
        :r.collDate?`⚠ 마지막 수금일(${r.collDate})이 1년 이상 지남 — 실제 상환여부 재확인 필요`
        :'⚠ 입금기록 메모는 있으나 수금일 데이터 없음 — 재확인 필요';
    }
    return{n:1,l:'충당완료급',s:'최우선 처리',c:'#b91c1c',bg:'#fee2e2',warn};
  }
  return{n:2,l:'회수의문급',s:'개별검토 필요',c:'#b45309',bg:'#fef3c7',warn:''};
}
function woCands(){
  return E.filter(r=>r.ar>0).map(r=>({r,rs:woReasons(r)})).filter(x=>{
    if(woOf(x.r))return true;  // 상태 지정된 건은 항상 표시
    const strong=x.rs.some(s=>/관리제외|폐업|회수불가|대손|충당금/.test(s));
    return strong||(x.r.type==='장기체납채권'&&x.rs.length>0);
  }).sort((a,b)=>(woTier(a.r).n-woTier(b.r).n)||(b.rs.length-a.rs.length)||(b.r.ar-a.r.ar));
}
async function woSet(ridv,st){
  const e=Object.assign({},EDITS[ridv]||{});

  h+=`<tr class="hl" onclick="goListAll()"><td class="lbl">연간 총 채권 발생액 (A)</td><td>${fmt(k.tot)}</td><td>${(k.tot/1e8).toFixed(1)}</td><td>100%</td><td class="lbl">${E.length}건 · 2020~2026년</td></tr>`;

  h+=`<tr class="grand hl" onclick="setView('list')"><td class="lbl">잔여 미수금 (A−B−C)</td><td>${fmt(k.arSum)}</td><td>${(k.arSum/1e8).toFixed(1)}</td><td>${pct(k.tot?k.arSum/k.tot:0)}</td><td class="lbl"></td></tr>`;

  h+=`<tr class="grand"><td class="lbl">합계</td><td>${E.length}</td><td>${fmt(k.tot)}</td><td>${fmt(k.arSum)}</td><td>${pct(k.tot?k.arSum/k.tot:0)}</td><td>${fmt(k.prov)}</td></tr></tbody></table></div>`;
  h+='</div></div>';
  h+='<h4>관리 채권 조치 계획 <span class="hint noprint">행 클릭 → 해당 채권 목록</span></h4><div class="tbl-scroll"><table class="rt"><thead><tr><th class="lbl">구분</th><th>대상</th><th class="lbl">현황 및 원인</th><th class="lbl">조치 내용</th><th class="lbl">목표 기한</th><th class="lbl">담당</th></tr></thead><tbody>';
  h+=`<tr class="hl" onclick="goListType('지연채권')"><td class="lbl">${typeChip('지연채권')} (${eok2(delay.ar)}원)</td><td>${delay.cnt}건</td><td class="lbl" style="white-space:normal">2023~2025년 매출, 할부·팩토링 지연 및 분납 약정 미이행</td><td class="lbl" style="white-space:normal">담당자 직접 접촉 → 분납 약정 재설정 또는 일괄 수금 협의</td><td class="lbl">2026년 9월말 (Q3)</td><td class="lbl">국내영업팀 담당자별</td></tr>`;
  h+=`<tr class="hl" onclick="goListType('장기체납채권')"><td class="lbl">${typeChip('장기체납채권')} (${eok2(lt.ar)}원)</td><td>${lt.cnt}건</td><td class="lbl" style="white-space:normal">2020~2022년 매출, 대부분 폐업·연락불가 → ${eok2(lt.prov)}원 충당금 기설정</td><td class="lbl" style="white-space:normal">잔여 ${eok2(ltRisk)}원 소송 회수 또는 대손처리 확정 (법무팀 협의)</td><td class="lbl">2026년 12월말</td><td class="lbl">국내영업팀 + 재무팀</td></tr>`;
  h+='</tbody></table></div>';
  // 지연채권 수금 진행(주간)
  const w=(RAW.weekly||[]);
  const dlSeries=w.map(x=>((x.types||{})['지연채권']||{ar:null}).ar).filter(v=>v!=null);
  if(dlSeries.length>=2){
    const peak=Math.max(...dlSeries),cur=dlSeries[dlSeries.length-1];
    const done=peak>0?Math.max(0,(peak-cur)/peak):0;
    h+='<h4>지연채권 수금 진행 (2026 Q3말 전액 수금 목표)</h4>';
    h+=`<div style="font-size:13px;margin-bottom:6px">연중 최고 ${eok2(peak)} → 현재 <b>${eok2(cur)}</b> (${pct(done)} 감축) · 목표 기한 <b>2026-09-30</b></div>`;
    h+=`<div class="prog" style="height:14px"><div style="width:${(100*done).toFixed(1)}%;background:${done>=.5?'#15803d':'#b45309'}"></div></div>`;
    h+=`<div class="hint">잔여 ${eok2(cur)} — 담당자별 분납 재약정·일괄수금 협의 중, 월별 점검</div>`;
  }
  h+=`<div class="concl">➤ 총 미수금 ${eok(k.arSum)}원 중 실질 회수 위험액은 ${eok2(k.risk)}원(${pct(k.arSum?k.risk/k.arSum:0)})이며, 이 중 장기체납 잔여 ${eok2(ltRisk)}원은 충당금 기설정으로 추가 손실 위험 최소화</div>`;
  // 예상 질문 & 답변(Q&A)
  h+='<h4>예상 질문 & 답변 대비</h4>';
  h+='<div class="qa-grid">'+buildQA(k,delay,lt).map(([q,a])=>`<details class="qa" open><summary>${q}</summary><div class="a">${a}</div></details>`).join('')+'</div>';
  h+='</div>';
  return h;
}
// 임원보고·발표용 공용 예상질문 데이터
function buildQA(k,delay,lt){
  const ya2=yearAgg(E);const y26=ya2['2026']||{amt:0,ar:0};
  return [
    ['실질 위험액이 '+((k.arSum-k.prov)/1e8).toFixed(1)+'억이라는 표와 '+eok2(k.risk)+'이라는 표가 다른데, 어느 게 맞습니까?',
     '두 수치 모두 맞습니다. '+((k.arSum-k.prov)/1e8).toFixed(1)+'억원은 잔여 미수금에서 대손충당금만 뺀 단순 계산값으로 정상 수금 진행 중인 채권까지 포함합니다. '+eok2(k.risk)+'원은 정상채권을 제외하고 실제 관리가 필요한 지연채권+장기체납 잔여위험만 합산한 수치로, 경영 관점의 실질 위험액입니다.'],
    ['지연채권 '+eok2(delay.ar)+'원, 9월까지 정말 다 걷을 수 있습니까?',
     '담당자별로 분납 약정 재설정 또는 일괄 수금을 협의 중이며, 이 시스템으로 주별 진행 상황을 점검합니다. 진행이 지연될 경우 조기에 별도 보고드리겠습니다.'],
    ['장기체납채권은 왜 아직 대손처리하지 않았습니까?',
     '폐업·연락 불가 거래처가 대부분으로 법적 절차(소송 회수 또는 대손 확정)가 필요해 법무팀과 협의 중입니다. 이미 '+pct(lt.ar?lt.prov/lt.ar:0)+'는 충당금으로 설정해 재무적 영향은 제한적입니다.'],
    ['2026년 미수율('+pct(y26.amt?y26.ar/y26.amt:0)+')이 다른 해보다 높아 보이는데 문제 없습니까?',
     '2026년은 당해 매출이라 아직 결제 주기가 남아있는 리스·카드 결제 건이 많기 때문입니다. 실제 부실이 아니라 정상적인 수금 사이클상의 미수율입니다.'],
    (function(){const wc=woCands();const t1=wc.filter(x=>woTier(x.r).n===1).length,t2=wc.filter(x=>woTier(x.r).n===2).length,warned=wc.filter(x=>woTier(x.r).warn).length;
      return ['손실처리 후보 '+wc.length+'건 중 충당완료급/회수의문급은 어떻게 나눈 겁니까?',
        '사건 발생 여부(폐업·관리제외)와 충당금 커버율 2가지 데이터 기준으로 자동 분류했습니다. 충당완료급 '+t1+'건은 충당금이 이미 100% 설정돼 확정해도 추가 손실이 없는 건이고, 회수의문급 '+t2+'건은 충당금이 덜 쌓여 있어 확정 시 실제 손실이 발생하니 개별 확인이 필요한 건입니다(이쪽은 등급 자체가 이미 검토 대상이라 별도 배지는 안 붙입니다). 충당완료급 중 '+warned+'건은 "안전하다"고 판단했음에도 입금·분납 기록이 있어 ⚠ 재확인 배지를 붙였는데, 실제 수금일을 확인해보니 1년 넘게 지난 옛 기록이라 등급은 그대로 두고 배지로만 주의를 줍니다.'];})(),
    ['대시보드의 채권 연령(Aging) "3년 이상" 건수와 손실처리 후보 건수가 같아 보이는데 같은 건입니까?',
     '아닙니다. 채권 연령은 단순히 매출일 기준 경과기간만으로 나눈 것이고, 손실처리 후보는 폐업·회수불가·충당금 설정 등 여러 조건을 함께 만족해야 들어갑니다. 우연히 건수가 비슷하게 나올 수는 있지만 서로 다른 기준의 별개 집계입니다.'],
    (function(){var arCnt=E.filter(function(r){return r.ar>0;}).length,wcN=woCands().length;
      return ['왜 '+wcN+'건이 전부입니까, 더 있는 거 아닙니까?',
       '잔액이 남아있는 채권 '+arCnt+'건 전체를 다시 확인했고, 그중 폐업·장기체납·회수불가 신호가 있는 건이 이 '+wcN+'건이었습니다. 나머지 '+(arCnt-wcN)+'건은 정상채권이거나 실제로 정상 수금·분납이 진행 중인 지연채권이라 후보에서 제외했습니다.'];})(),
    (function(){var z=woCands().filter(function(x){return woTier(x.r).n===2&&(Number(x.r.prov)||0)===0;}).sort(function(a,b){return b.r.ar-a.r.ar;})[0];
      if(!z) return ['회수의문급 중 충당금 미설정 건은 어떻게 처리합니까?','충당금이 아직 설정되지 않은 회수의문급 건은 확정 시 잔액이 그대로 새 손실로 잡히므로, 개별적으로 재무팀 확인 후 진행합니다.'];
      return ['회수의문급 '+z.r.name+'은(는) 왜 충당금이 0원입니까?',
       '비교적 최근에 폐업 처리된 건이라 아직 충당금을 쌓을 시간이 없었던 것으로 보입니다. 확정 시 '+eok2(z.r.ar)+'이 그대로 새 손실로 잡히는 건이라 재무팀 확인이 필요합니다.'];})()
  ];
}

// ═══ 발표용 요약(비공개) ═══
function viewBrief(){
  const k=kpis();
  const delay=(k.ta['지연채권']||{cnt:0,ar:0,prov:0}),lt=(k.ta['장기체납채권']||{cnt:0,ar:0,prov:0});

  const byTier=n=>cands.filter(x=>woTier(x.r).n===n);
  const t1=byTier(1),t2=byTier(2);
  const warned=cands.filter(x=>woTier(x.r).warn);
  document.getElementById('pt-a').innerHTML='<button class="btn" onclick="window.print()"><i class="bi bi-printer"></i> 인쇄</button>';
  let h='<div class="editable-note" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">🔒 이 화면은 본인 계정에만 보입니다. 발표 준비용 상세 자료이며, 실시간 상태 변경은 <a onclick="setView(\'wo\')" style="color:inherit;text-decoration:underline;cursor:pointer">손실처리</a> 메뉴에서 하세요.</div>';
  h+='<div class="kpis" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px">';
  h+=`<div class="kpi" style="flex:1 1 200px;min-width:0"><div class="l">총 채권 / 수금률</div><div class="v">${eok(k.tot)}</div><div class="s">수금률 ${pct(k.collRate)} · ${E.length}건</div></div>`;
  h+=`<div class="kpi" style="flex:1 1 200px;min-width:0"><div class="l">잔여 미수금</div><div class="v" style="color:#b45309">${eok(k.arSum)}</div><div class="s">전체의 ${pct(k.tot?k.arSum/k.tot:0)}</div></div>`;
  h+=`<div class="kpi" style="flex:1 1 200px;min-width:0"><div class="l">손실처리 후보</div><div class="v" style="color:#b91c1c">${cands.length}건</div><div class="s">예상손실 ${eok2(addLoss(cands))}</div></div>`;
  h+='</div>';
  h+='<div class="card"><div class="sec">손실처리 '+cands.length+'건 — 2단계 우선순위</div>';

function xlDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
  const s=String(v).trim();const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:s;
}
function xlNum(v){if(v==null||v==='')return 0;const n=Number(String(v).replace(/,/g,''));return isNaN(n)?0:n;}
function xlStr(v){if(v==null)return '';if(v instanceof Date)return xlDate(v);return String(v).trim();}
// 주간시트 헤더명 → 필드 매핑
const HMAP={'구분':'no','거래처코드':'code','거래처 명':'name','거래처명':'name','사업자번호':'bizno','채권구분':'cls','시장 분류':'mkt','부서명':'dept','사업군 분류':'seg','매출일자':'saleDate','년도':'year','적요(매출 내용)':'memo','외화잔액':'fx','원화금액':'amt','수금일':'collDate','수금금액':'coll','감사/부실':'audit','대손처리':'bad','원화 미수채권금액':'ar','대손충당 설정률':'provRate','대손 충당금':'prov','잔존가':'residual','입금내역 및 특이사항':'payNote','경과년수':'elapsed','채권 특성 (TF)':'trait','채권 유형 (TF)':'type','담당자':'mgr','실무진 의견 (TF)':'opinion','지급 기일':'dueNote','향후 수금 계획 (담당자 및 소속부서장)':'plan'};
const NUMF=new Set(['fx','amt','coll','bad','ar','provRate','prov','residual']);
function parseWeeklySheet(ws){
  const g=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  // 헤더행 탐색(거래처명 포함 행)
  let hi=-1;for(let i=0;i<Math.min(g.length,10);i++){const r=g[i]||[];if(r.some(c=>String(c||'').indexOf('거래처')>=0&&String(c||'').indexOf('코드')<0)&&r.some(c=>String(c||'')==='매출일자')){hi=i;break;}}
  if(hi<0)return null;
  const cols={};(g[hi]||[]).forEach((c,j)=>{const k=HMAP[String(c||'').trim()];if(k&&cols[k]===undefined)cols[k]=j;});
  if(cols.name===undefined||cols.amt===undefined)return null;
  const rows=[];
  for(let i=hi+1;i<g.length;i++){const r=g[i]||[];if(!xlStr(r[cols.name]))continue;
    const o={};
    Object.keys(HMAP).forEach(h=>{const f=HMAP[h];if(cols[f]===undefined){o[f]=NUMF.has(f)?0:'';return;}
      const v=r[cols[f]];
      o[f]=(f==='saleDate'||f==='collDate')?xlDate(v):NUMF.has(f)?xlNum(v):xlStr(v);});
    if(o.year)o.year=String(o.year).replace(/[^0-9.]/g,'').split('.')[0];
    rows.push(o);}
  return rows;
}
// 행단위 주간 변동(diff) — 파이썬 시드(ar_seed.py diff_weeks)와 동일 로직
function diffRows(prevRows,curRows,d,prevD){
  const pm={};prevRows.forEach(o=>pm[o.rid]=o);
  const cm={};curRows.forEach(o=>cm[o.rid]=o);
  const coll=[],red=[],neu=[],adj=[];
  let gone=Object.keys(pm).filter(r=>!cm[r]).map(r=>pm[r]);
  Object.keys(cm).forEach(r=>{
    const o=cm[r];let p=pm[r];
    if(!p){
      const sk=o.code+'|'+o.saleDate+'|'+String(Math.trunc(o.amt));
      const gi=gone.findIndex(x=>x.code+'|'+x.saleDate+'|'+String(Math.trunc(x.amt))===sk);
      if(gi>=0){p=gone[gi];gone.splice(gi,1);}
      else if(o.ar>0){neu.push({n:o.name,v:o.ar,m:o.memo,g:o.mgr,t:o.type});return;}
      else return;
    }
    if(p.ar>0&&o.ar===0)coll.push({n:o.name,v:p.ar,m:o.memo,g:o.mgr,t:o.type});
    else if(o.ar>0&&o.ar<p.ar)red.push({n:o.name,v:p.ar-o.ar,d0:o.ar,m:o.memo,g:o.mgr,t:o.type});
  });
  gone.forEach(o=>{if(o.ar>0)adj.push({n:o.name,v:o.ar,m:o.memo,g:o.mgr,t:o.type});});
  return {d,prev:prevD,coll,red,new:neu,adj,
    sumColl:coll.reduce((s,x)=>s+x.v,0)+red.reduce((s,x)=>s+x.v,0),
    sumNew:neu.reduce((s,x)=>s+x.v,0),
    sumAdj:adj.reduce((s,x)=>s+x.v,0)};
}

        if(prevRows){const ch=diffRows(prevRows,rows,d,prevD);if(ch.coll.length||ch.red.length||ch.new.length||ch.adj.length)fileChanges.push(ch);}

      const cmap={};((RAW.changes)||[]).forEach(x=>cmap[x.d]=x);fileChanges.forEach(x=>cmap[x.d]=x);
      const mergedCh=Object.values(cmap).sort((a,b)=>a.d.localeCompare(b.d));
      _up={asOf:latestD,updatedAt:today(),rows:latestRows,weekly:merged,changes:mergedCh,mgmt};
      const arSum=latestRows.reduce((s,o)=>s+o.ar,0);
      const prevAr=(RAW.weekly&&RAW.weekly.length)?RAW.weekly[RAW.weekly.length-1].ar:0;
      // 안전장치: 건수 급감(재무팀 파일 이상 가능성)·기준일 역행 경고
      const warns=[];
      if(RAW.rows&&latestRows.length<RAW.rows.length*0.95)warns.push('채권 건수가 현재('+RAW.rows.length+'건)보다 5% 이상 적습니다('+latestRows.length+'건) — 파일이 일부만 담겼는지 확인하세요.');
      if(latestD<((RAW&&RAW.asOf)||''))warns.push('파일의 최신 주간시트('+latestD+')가 현재 기준일('+RAW.asOf+')보다 과거입니다 — 적용 시 데이터가 되돌아갑니다.');

function parseMgmtSheet(ws,name,latestRows){
  try{
    const g=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const grid=g.map(r=>(r||[]).map(c=>xlStr(c)));
    const mg={asOf:'',base:'',summary:{},items:[]};
    const tail=name.split('_').pop();if(/^\d{6}$/.test(tail))mg.asOf='20'+tail.slice(0,2)+'-'+tail.slice(2,4)+'-'+tail.slice(4,6);
    for(const row of grid){for(const c of row){const m=String(c).match(/기준일 (\d{4}-\d{2}-\d{2})/);if(m)mg.base=m[1];}}
    let hi=-1;grid.forEach((row,i)=>{if(hi<0&&row.indexOf('추천분류')>=0&&row.indexOf('거래처명')>=0)hi=i;});
    // 요약
    grid.forEach((row,i)=>{
      if(row.indexOf('관리제외')>=0&&row.indexOf('집중관리')>=0&&i+2<grid.length&&!mg.summary['관리제외']){
        const hidx={};row.forEach((c,j)=>{if(c)hidx[c]=j;});
        ['관리제외','집중관리','검토필요','관리대상 합계'].forEach(k=>{if(hidx[k]!==undefined)mg.summary[k]={cnt:xlNum(grid[i+1][hidx[k]]),ar:xlNum(grid[i+2][hidx[k]])};});
      }});
    if(hi<0)return null;
    const h=grid[hi];const col={};h.forEach((c,j)=>{if(c&&col[c]===undefined)col[c]=j;});
    const nn=s=>String(s||'').replace(/\([^)]*\)/g,'').replace(/\s/g,'');
    for(let i=hi+1;i<grid.length;i++){const row=grid[i];if(!row[col['거래처명']])continue;
      const it={no:row[col['No']],name:row[col['거래처명']],year:row[col['발생년도']]||'',elapsed:row[col['경과년수']]||'',ar:xlNum(row[col['미수금액(원)']]),mgr:row[col['담당자']]||'',state:row[col['현재상태']]||'',cls:row[col['추천분류']]||'',basis:row[col['분류 근거']]||'',opinion:row[col['관리 의견']]||''};
      let mo=latestRows.find(o=>String(Math.trunc(xlNum(o.no)||0))===String(Math.trunc(xlNum(it.no)||0))&&o.name===it.name);
      if(!mo)mo=latestRows.find(o=>o.name===it.name&&Math.abs(o.ar-it.ar)<1);
      if(!mo)mo=latestRows.find(o=>nn(o.name)===nn(it.name)&&Math.abs(o.ar-it.ar)<1);
      it.rid=mo?mo.rid:('_um|'+nn(it.name)+'|'+Math.trunc(it.ar||0));
      mg.items.push(it);}
    return mg.items.length?mg:null;
  }catch(e){return null;}
}

  const ed=EDITS[ridv]||{};
  const F=(l,v)=>`<div class="fld"><label>${l}</label><div class="fv">${esc(v==null||v===''?'-':v)}</div></div>`;
  let h=`<div class="mhd"><div><h3>${esc(r.name)}</h3><div class="hint">${esc(r.saleDate)} · ${esc(r.memo)}</div></div><button class="x" onclick="closeModal()">✕</button></div><div class="mbody">`;
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${typeChip(r.type)}${mi?clsChip(mi.cls):''}${r._edited||ed.cls||ed.mgmtOp?'<span class="chip" style="background:#ecfdf5;color:#047857">사이트 수정됨'+(ed._by?' · '+esc(ed._by.split('@')[0])+' '+esc(ed._at||''):'')+'</span>':''}</div>`;
  h+='<div class="fgrid">'
    +F('원화금액',fmt(r.amt)+'원')+F('수금금액',fmt(r.coll)+'원'+(r.collDate?' ('+r.collDate+')':''))
    +F('미수채권금액',fmt(r.ar)+'원')+F('대손처리',fmt(r.bad)+'원')
    +F('대손충당금',fmt(r.prov)+'원')+F('경과년수',r.elapsed)
    +F('거래처코드',r.code)+F('사업자번호',r.bizno)
    +F('채권 특성',r.trait)
    +F('지급기일',r.dueNote)+F('발생년도',r.year)
    +'</div>';
  if(mi)h+='<div class="fgrid">'+F('관리 분류근거',mi.basis)+'</div>';
  // 이 거래처의 다른 채권
  const rel=E.filter(x=>x.name===r.name&&x.rid!==r.rid);
  if(rel.length){
    const relAr=rel.reduce((s,x)=>s+x.ar,0);
    h+=`<div class="fld" style="margin-bottom:14px"><label>🔗 이 거래처의 다른 채권 ${rel.length}건 (잔액 합계 ${fmt(relAr)}원 · 본건 포함 ${fmt(relAr+r.ar)}원)</label>`
      +rel.sort((a,b)=>b.ar-a.ar).slice(0,8).map(x=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;cursor:pointer" onclick="openRow('${x.rid}')"><span style="color:var(--muted);width:80px;flex-shrink:0">${esc(x.saleDate)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.memo)}</span>${typeChip(x.type)}<b style="color:${x.ar>0?'#b45309':'var(--muted)'}">${fmt(x.ar)}</b></div>`).join('')
      +(rel.length>8?`<div class="hint">외 ${rel.length-8}건 — 목록에서 거래처별 보기</div>`:'')+'</div>';
  }
  // 수금 활동 이력
  const log=(EDITS[ridv]&&EDITS[ridv].log)||[];
  if(log.length){
    h+=`<div class="fld" style="margin-bottom:14px"><label>🕘 수금 활동 이력 ${log.length}건</label>`
      +log.slice().reverse().map(x=>`<div style="display:flex;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px dashed var(--line)"><span style="color:var(--muted);width:80px;flex-shrink:0">${esc(x.d)}</span><span style="flex:1;color:var(--ink)">${esc(x.t)}</span><span class="hint">${esc((x.by||'').split('@')[0])}</span></div>`).join('')+'</div>';
  }
  h+='<div class="editable-note">✏️ 아래 항목은 수정 가능합니다. 저장 시 원본과 별도로 보관되어, 엑셀 재업로드 후에도 유지됩니다.</div>';
  if(r._mgrConflict)h+=`<div class="editable-note" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">⚠ 재무팀 최신 파일에는 담당자가 <b>${esc(r._mgrConflict)}</b>(으)로 되어 있어요. 지금 화면엔 사이트에서 입력한 값이 우선 표시 중입니다 — 재무팀 값이 맞다면 아래 담당자 칸을 그 값으로 고쳐서 다시 저장하세요.</div>`;
  h+=`<div class="fgrid" style="grid-template-columns:1fr 1fr">
    <div class="fld"><label>담당자</label><input id="ed-mgr" value="${esc(r.mgr||'')}" placeholder="예: 홍길동" onkeydown="if(event.key==='Enter'){event.preventDefault();saveEdit('${ridv}')}"></div>
    <div class="fld"><label>채권유형</label><select id="ed-type">${TYPE_ORDER.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    ${mi?`<div class="fld"><label>관리 분류</label><select id="ed-cls">${['집중관리','검토필요','관리제외'].map(c=>`<option ${mi.cls===c?'selected':''}>${c}</option>`).join('')}</select></div>`:''}
    <div class="fld"><label>다음 조치일 <span class="hint">(도래 시 대시보드 팔로우업에 표시)</span></label><input type="date" id="ed-nextDate" value="${esc(r.nextDate||'')}"></div>
    <div class="fld"><label>다음 조치 내용</label><input id="ed-nextAct" value="${esc(r.nextAct||'')}" placeholder="예: 분납 재약정 통화" onkeydown="if(event.key==='Enter'){event.preventDefault();saveEdit('${ridv}')}"></div>
  </div>
  <div class="fld" style="margin-bottom:10px"><label>➕ 활동 기록 추가 <span class="hint">(저장 시 오늘 날짜·작성자로 이력에 쌓임)</span></label><textarea id="ed-log" placeholder="예: 원장 통화 — 7월 말 500만원 입금 약속"></textarea></div>
  <div class="fld" style="margin-bottom:10px"><label>향후 수금 계획</label><textarea id="ed-plan">${esc(r.plan)}</textarea></div>
  <div class="fld" style="margin-bottom:10px"><label>입금내역 · 특이사항</label><textarea id="ed-payNote">${esc(r.payNote)}</textarea></div>
  <div class="fld" style="margin-bottom:10px"><label>실무진 의견</label><textarea id="ed-opinion">${esc(r.opinion)}</textarea></div>
  ${mi?`<div class="fld" style="margin-bottom:10px"><label>관리 의견</label><textarea id="ed-mgmtOp">${esc(mi.opinion)}</textarea></div>`:''}
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    ${EDITS[ridv]?'<button class="btn" onclick="resetEdit(\''+ridv+'\')">↩ 원본 복원</button>':''}
    <button class="btn" onclick="closeModal()">닫기</button>
    <button class="btn pri" onclick="saveEdit('${ridv}')">저장</button>
  </div></div>`;
  document.getElementById('mbox').innerHTML=h;
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){var _fm=document.getElementById('ed-mgr');if(_fm)_fm.focus();},30);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
async function saveEdit(ridv){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():undefined;};
  const r=(RAW.rows||[]).find(x=>x.rid===ridv)||{};
  const mi=((RAW.mgmt&&RAW.mgmt.items)||[]).find(i=>i.rid===ridv);
  const e=Object.assign({},EDITS[ridv]||{});
  const set=(k,v,orig)=>{if(v===undefined)return;if(v===String(orig==null?'':orig).trim()){delete e[k];}else{e[k]=v;}};
  set('mgr',g('ed-mgr'),r.mgr);set('type',g('ed-type'),r.type);set('plan',g('ed-plan'),r.plan);set('payNote',g('ed-payNote'),r.payNote);set('opinion',g('ed-opinion'),r.opinion);
  set('nextDate',g('ed-nextDate'),'');set('nextAct',g('ed-nextAct'),'');
  if(mi){set('cls',g('ed-cls'),mi.cls);set('mgmtOp',g('ed-mgmtOp'),mi.opinion);}
  const logTxt=g('ed-log');
  if(logTxt){e.log=(e.log||[]).concat([{d:today(),by:ME,t:logTxt}]);}
  if(e.log&&!e.log.length)delete e.log;
  const keys=Object.keys(e).filter(k=>k[0]!=='_');
  if(!keys.length){delete EDITS[ridv];}
  else{e._by=ME;e._at=today();EDITS[ridv]=e;}
  const res=await _sb.from('cons_cache').upsert({key:'ar_kr_edits',data:EDITS},{onConflict:'key'});
  if(res.error){toast('저장 실패: '+res.error.message);return;}
  applyEdits();closeModal();render();toast('저장됨 ✓');
}
async function resetEdit(ridv){
  if(!EDITS[ridv])return closeModal();
  if(!confirm('이 채권의 사이트 수정분을 지우고 엑셀 원본으로 되돌릴까요?'))return;
  delete EDITS[ridv];
  const res=await _sb.from('cons_cache').upsert({key:'ar_kr_edits',data:EDITS},{onConflict:'key'});
  if(res.error){toast('실패: '+res.error.message);return;}
  applyEdits();closeModal();render();toast('복원됨');
}

boot();
</script>
<script>
/* 서비스워커 등록: 일반 새로고침(F5)에도 항상 최신 HTML(network-first) — 하드리프레시 불필요 */
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){}); } if(window.caches&&caches.keys){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}).catch(function(){}); }
</script>
<script>/* WT_UPDATE_V1 — 새 버전 감지 시 상단 새로고침 바 (전 사이트 공통 스니펫, 개별 수정 금지) */
(function(){var base=null;
function bar(){if(document.getElementById('wt-upd'))return;var d=document.createElement('div');d.id='wt-upd';
d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483000;background:#16324f;color:#fff;font-family:inherit;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25)';
d.innerHTML='<i class="bi bi-arrow-clockwise"></i><span>새 버전이 배포되었습니다.</span><button onclick="location.reload()" style="background:#fff;color:#16324f;border:none;border-radius:7px;padding:4px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit">지금 새로고침</button><button onclick="this.parentNode.remove()" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit">나중에</button>';
document.body.appendChild(d);}
function et(){return fetch(location.pathname+'?uchk='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(r){return r.headers.get('etag')||r.headers.get('last-modified')||'';}).catch(function(){return null;});}
function chk(){et().then(function(e){if(e==null||e==='')return;if(base===null){base=e;return;}if(e!==base)bar();});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)chk();});
setInterval(chk,5*60*1000);chk();
})();</script>
</body>
